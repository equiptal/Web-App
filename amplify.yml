# AWS Amplify build spec — matches how the Moedatech admin panel (apps/c-hub) is hosted.
# This is a standalone Next.js (SSR) repo, so the build runs at the repo root (no monorepo appRoot).
# Environment variables (MANSOUR_URL / AGENTS_API_URL / AGENTS_API_TOKEN) are set per-branch in the
# Amplify console — never committed. See .env.example for the full list.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Amplify injects branch env vars at BUILD time only — the SSR compute (Lambda) does not get
        # them at runtime. Write them into .env.production so `next build` bundles them into the server
        # output (AWS-documented workaround for Next.js SSR env vars). Token is written but never echoed.
        - env | grep -E '^(MANSOUR_URL|AGENTS_API_URL|AGENTS_API_TOKEN|AGENTS_TEST_USER_ID|APP_API_URL|TENANT_ID|NEXT_PUBLIC_GOOGLE_MAPS_API_KEY)=' >> .env.production || true
        - env | grep -E '^(MANSOUR_URL|AGENTS_API_URL|APP_API_URL)=' || true   # token intentionally not logged
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
