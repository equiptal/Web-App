<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<title>Guest Home — Moedatech</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap"
  rel="stylesheet"
/>

<!--
  Moedatech — GUEST HOME · v4
  Two things on the page, in this order:
    1 · the agent — one box, describe the need, it becomes an RFQ
    2 · the stores — categories, 12 suppliers, open one to see its equipment
  Top bar is the app's own (AppShell.tsx): navy, 62px, centred white pills.
-->

<style>
  :root{
    --navy:#1c3550; --navy-mid:#2a4f72; --muted:#6b8fa8; --faint:#9bb3c8;
    --brand:#f79009; --ok:#1daf58; --info:#1a7ec8; --warn:#e2564a;
    --bg:#f7f9fc; --card:#fff; --plinth:#eaf0f6; --sunk:#f1f5f9;
    --border:#e2e9f0; --line:#eef3f8;
    --r:16px; --r-pill:999px;
    --ease:cubic-bezier(.32,.72,.24,1);
    --shadow:0 10px 30px -18px rgba(18,38,58,.45);
    --shadow-lg:0 40px 90px -40px rgba(18,38,58,.6);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--navy);font-family:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  [dir="rtl"]{font-family:"IBM Plex Sans Arabic","Nunito",sans-serif}
  body.locked{overflow:hidden}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  a{color:inherit;text-decoration:none}
  .icon{font-family:"Material Symbols Rounded";line-height:1;display:inline-block;direction:ltr;
    -webkit-font-feature-settings:"liga";user-select:none;font-variation-settings:"opsz" 24,"wght" 400,"FILL" 0}
  .mono{font-family:"IBM Plex Mono",monospace}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
  h1,h2,h3,h4{margin:0;letter-spacing:-.03em;line-height:1.15;font-weight:800}
  .wrap{max-width:1400px;margin:0 auto;padding:0 32px}

  /* ── app top bar (AppShell.tsx) ─────────────────────────────────────────── */
  .appbar{position:sticky;top:0;z-index:40;height:62px;background:var(--navy);color:#fff;
    border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;padding:0 32px}
  .wordmark{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16.5px;letter-spacing:-.03em}
  .wordmark .m{width:26px;height:26px;border-radius:8px;background:#fff;color:var(--navy);display:grid;place-items:center;font-size:16px}
  .navslot{position:absolute;inset-inline:0;display:none;justify-content:center;pointer-events:none}
  @media (min-width:1024px){ .navslot{display:flex} }
  .navslot .row{pointer-events:auto;display:flex;gap:4px}
  .navtab{border-radius:var(--r-pill);padding:6px 16px;font-size:14px;font-weight:600;color:rgba(255,255,255,.7)}
  .navtab:hover{background:rgba(255,255,255,.1);color:#fff}
  .navtab.on{background:#fff;color:var(--navy);font-weight:800}
  .barright{margin-inline-start:auto;display:flex;align-items:center;gap:12px;z-index:1}
  .loc{display:inline-flex;align-items:center;gap:6px;height:28px;border-radius:var(--r-pill);
    border:1px solid rgba(255,255,255,.25);padding:0 10px;font-size:12.5px;font-weight:600;color:#fff}
  .loc:hover{background:rgba(255,255,255,.1)}
  .loc .icon{font-size:15px}
  .signin{display:inline-flex;align-items:center;gap:7px;background:var(--brand);color:#fff;
    border-radius:var(--r-pill);padding:8px 15px;font-size:13px;font-weight:700}
  .signin:hover{filter:brightness(1.06)}
  .signin .icon{font-size:16px}

  /* ── 1 · the agent ──────────────────────────────────────────────────────── */
  .agent{padding:54px 0 46px;text-align:center}
  .agent .eyebrow{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;
    font-weight:700;letter-spacing:.14em;text-transform:uppercase}
  .agent .eyebrow .icon{font-size:15px;color:var(--brand)}
  .agent h1{margin:14px auto 0;font-size:clamp(26px,3.4vw,40px);max-width:19ch}
  .agent .sub{margin:12px auto 0;color:var(--muted);font-size:15px;max-width:56ch}

  .box{max-width:780px;margin:26px auto 0;background:var(--card);border:1px solid var(--border);
    border-radius:22px;box-shadow:var(--shadow);text-align:start;transition:border-color .2s,box-shadow .2s}
  .box:focus-within{border-color:var(--brand);box-shadow:0 12px 34px -18px rgba(247,144,9,.5)}
  .box textarea{width:100%;border:0;outline:0;resize:none;background:none;font:inherit;font-size:16px;
    color:var(--navy);padding:20px 22px 6px;min-height:92px}
  .box textarea::placeholder{color:var(--faint)}
  .boxbar{display:flex;align-items:center;gap:8px;padding:10px 12px 12px 14px}
  .tool{display:inline-flex;align-items:center;gap:7px;border-radius:var(--r-pill);padding:8px 13px;
    font-size:13px;font-weight:700;color:var(--navy-mid);border:1px solid var(--border)}
  .tool:hover{background:var(--sunk);border-color:var(--navy-mid)}
  .tool .icon{font-size:17px}
  .boxbar .spacer{flex:1}
  .send{width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;
    transition:transform .18s var(--ease),filter .18s}
  .send:hover{transform:scale(1.05);filter:brightness(1.05)}
  .send .icon{font-size:22px}
  [dir="rtl"] .send .icon{transform:scaleX(-1)}

  .examples{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .ex{border-radius:var(--r-pill);padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--navy-mid);
    background:var(--card);border:1px solid var(--border)}
  .ex:hover{border-color:var(--navy-mid);color:var(--navy)}

  /* ── 2 · stores ─────────────────────────────────────────────────────────── */
  .stores{padding:12px 0 60px}
  .head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  .head h2{font-size:22px}
  .head .spacer{flex:1}
  .pager{display:flex;align-items:center;gap:10px}
  .pager .count{font-size:12.5px;color:var(--muted)}
  .pager button{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--card);
    display:grid;place-items:center;color:var(--navy)}
  .pager button:hover:not(:disabled){background:var(--sunk)}
  .pager button:disabled{opacity:.3;cursor:default}
  .pager .icon{font-size:18px}
  [dir="rtl"] .pager .icon{transform:scaleX(-1)}

  .cats{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:18px}
  .cats::-webkit-scrollbar{display:none}
  .catpill{flex:none;border-radius:var(--r-pill);padding:8px 14px;font-size:13px;font-weight:700;
    color:var(--navy-mid);background:var(--card);border:1px solid var(--border)}
  .catpill:hover{border-color:var(--navy-mid)}
  .catpill.on{background:var(--navy);border-color:var(--navy);color:#fff}

  .grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px 16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;
    transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .shot{aspect-ratio:1/.66;background:var(--plinth);display:grid;place-items:center;position:relative}
  .shot .glyph{font-size:54px;color:rgba(28,53,80,.22);transition:transform .4s var(--ease)}
  .card:hover .shot .glyph{transform:scale(1.06)}
  .shot .floor{position:absolute;inset-inline:22%;bottom:16%;height:9px;border-radius:50%;
    background:radial-gradient(ellipse at center,rgba(28,53,80,.16),transparent 70%)}
  .tick{position:absolute;top:9px;inset-inline-end:9px;width:20px;height:20px;border-radius:50%;background:var(--ok);
    color:#fff;display:grid;place-items:center}
  .tick .icon{font-size:13px}
  .info{padding:12px 14px 14px}
  .info h3{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info .m{color:var(--muted);font-size:12.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info .p{margin-top:8px;font-size:13px}
  .info .p b{font-family:"IBM Plex Mono",monospace;font-weight:600}
  .info .p span{color:var(--muted)}

  /* ── store sheet ────────────────────────────────────────────────────────── */
  .veil{position:fixed;inset:0;background:rgba(18,38,58,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
  .veil.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;inset:26px;max-width:1120px;margin:0 auto;background:var(--bg);border-radius:22px;z-index:61;
    overflow:hidden auto;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(16px);pointer-events:none;
    transition:opacity .25s var(--ease),transform .25s var(--ease)}
  .sheet.on{opacity:1;transform:none;pointer-events:auto}
  .sbar{position:sticky;top:0;z-index:5;height:56px;background:var(--navy);color:#fff;display:flex;align-items:center;
    gap:12px;padding:0 16px}
  .round{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;color:#fff}
  .round:hover{background:rgba(255,255,255,.1)}
  .round .icon{font-size:18px}
  [dir="rtl"] .round.back .icon{transform:scaleX(-1)}
  .sbar .t{font-size:14.5px;font-weight:700}
  .sbar .spacer{flex:1}

  .shead{padding:26px 28px 0;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .slogo{width:60px;height:60px;border-radius:16px;background:var(--card);border:1px solid var(--border);
    display:grid;place-items:center;font-size:23px;font-weight:800;flex:none}
  .shead h2{font-size:26px}
  .shead .meta{color:var(--muted);font-size:13px;margin-top:5px;display:flex;gap:14px;flex-wrap:wrap}
  .shead .meta span{display:inline-flex;align-items:center;gap:5px}
  .shead .meta .icon{font-size:15px;color:var(--faint)}

  .sbody{padding:22px 28px 40px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
  .chip{border-radius:var(--r-pill);padding:8px 14px;font-size:12.5px;font-weight:700;background:var(--card);
    border:1px solid var(--border);color:var(--navy-mid);display:inline-flex;gap:7px;align-items:center}
  .chip:hover{border-color:var(--navy-mid)}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .chip .c{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint)}
  .chip.on .c{color:rgba(255,255,255,.6)}

  .eqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
  .eq{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
  .eq:hover{box-shadow:var(--shadow)}
  .eqshot{aspect-ratio:4/3;background:var(--plinth);display:grid;place-items:center;position:relative}
  .eqshot .glyph{font-size:46px;color:rgba(28,53,80,.22)}
  .eqshot .floor{position:absolute;inset-inline:22%;bottom:15%;height:8px;border-radius:50%;
    background:radial-gradient(ellipse at center,rgba(28,53,80,.15),transparent 70%)}
  .eqinfo{padding:13px 14px 14px}
  .eqinfo h4{font-size:14.5px;font-weight:800}
  .eqinfo .m{color:var(--muted);font-size:12.5px;margin-top:3px}
  .eqinfo .p{margin-top:9px;font-size:15px;font-weight:800;letter-spacing:-.02em}
  .eqinfo .p span{font-size:11.5px;font-weight:600;color:var(--muted);margin-inline-start:4px}
  .ask{margin-top:11px;width:100%;border-radius:var(--r-pill);padding:9px;background:var(--brand);color:#fff;
    font-size:12.5px;font-weight:700}
  .ask:hover{filter:brightness(1.06)}

  /* ── gate ───────────────────────────────────────────────────────────────── */
  .gate{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
  .gate.on{opacity:1;pointer-events:auto}
  .gate .bg{position:absolute;inset:0;background:rgba(18,38,58,.58)}
  .gbox{position:relative;background:var(--card);border-radius:20px;max-width:420px;width:100%;padding:28px;box-shadow:var(--shadow-lg)}
  .gbox h3{font-size:21px}
  .gbox p{margin:10px 0 0;color:var(--muted);font-size:14px;line-height:1.6}
  .gbox .acts{display:grid;gap:9px;margin-top:20px}
  .gbox button{border-radius:var(--r-pill);padding:13px;font-size:13.5px;font-weight:700}
  .gbox .primary{background:var(--brand);color:#fff}
  .gbox .ghost{border:1px solid var(--border);color:var(--navy)}
  .gbox .ghost:hover{background:var(--sunk)}

  .foot{padding:0 0 40px;color:var(--faint);font-size:12px;text-align:center}

  @media (max-width:1240px){ .grid{grid-template-columns:repeat(4,minmax(0,1fr))} }
  @media (max-width:900px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
  @media (max-width:620px){
    .wrap,.appbar{padding-inline:14px}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 10px}
    .agent{padding:30px 0 28px}
    .loc span:not(.icon){display:none}
    .sheet{inset:0;border-radius:0}
    .shead,.sbody{padding-inline:16px}
  }
</style>
</head>
<body>

<header class="appbar">
  <a class="wordmark" href="#"><span class="m icon">construction</span>moedatech</a>
  <div class="navslot"><div class="row">
    <a class="navtab on" href="#" data-en="Rent" data-ar="استأجر">Rent</a>
    <a class="navtab" href="#stores" data-en="Suppliers" data-ar="المؤجّرون">Suppliers</a>
    <a class="navtab" href="#" data-en="How it works" data-ar="كيف تعمل">How it works</a>
  </div></div>
  <div class="barright">
    <button class="loc" onclick="setLang(lang === 'en' ? 'ar' : 'en')">
      <span class="icon">language</span><span id="loclabel">English</span>
    </button>
    <button class="signin" onclick="gate('signin')">
      <span class="icon">login</span><span data-en="Sign in" data-ar="تسجيل الدخول">Sign in</span>
    </button>
  </div>
</header>

<!-- ══ 1 · THE AGENT ═════════════════════════════════════════════════════════ -->
<section class="wrap agent">
  <span class="eyebrow"><span class="icon">auto_awesome</span><span data-en="Ask the agent" data-ar="اسأل الوكيل">Ask the agent</span></span>
  <h1 data-en="Tell us what your site needs" data-ar="أخبرنا بما يحتاجه موقعك">Tell us what your site needs</h1>
  <p class="sub" data-en="Type it, paste an email, or drop a BOQ. It comes back as a request suppliers can price." data-ar="اكتبه، أو الصق بريداً، أو أرفق جدول كميات. يعود طلباً يستطيع المؤجّرون تسعيره.">Type it, paste an email, or drop a BOQ. It comes back as a request suppliers can price.</p>

  <div class="box">
    <textarea id="ask" rows="3"
      data-ph-en="Two 20-ton excavators with operators in Qiddiya, three months from 1 September…"
      data-ph-ar="حفّارتان ٢٠ طن مع مشغّلين في القدية، ثلاثة أشهر من ١ سبتمبر…"
      placeholder="Two 20-ton excavators with operators in Qiddiya, three months from 1 September…"></textarea>
    <div class="boxbar">
      <button class="tool" onclick="gate('request')"><span class="icon">attach_file</span><span data-en="Attach a file" data-ar="أرفق ملفاً">Attach a file</span></button>
      <span class="spacer"></span>
      <button class="send" onclick="gate('request')" aria-label="send"><span class="icon">arrow_forward</span></button>
    </div>
  </div>

  <div class="examples" id="examples"></div>
</section>

<!-- ══ 2 · STORES ════════════════════════════════════════════════════════════ -->
<main class="wrap stores" id="stores">
  <div class="head">
    <h2 id="title"></h2>
    <span class="spacer"></span>
    <div class="pager">
      <span class="count" id="count"></span>
      <button id="prev" onclick="page(-1)" aria-label="previous"><span class="icon">chevron_left</span></button>
      <button id="next" onclick="page(1)" aria-label="next"><span class="icon">chevron_right</span></button>
    </div>
  </div>

  <div class="cats" id="cats"></div>
  <div class="grid" id="grid"></div>
</main>

<div class="foot">
  <span data-en="Moedatech · equipment rental marketplace" data-ar="معداتك · سوق تأجير المعدات">Moedatech · equipment rental marketplace</span>
</div>

<div class="veil" id="veil" onclick="closeStore()"></div>
<div class="sheet" id="sheet"></div>

<div class="gate" id="gate">
  <div class="bg" onclick="closeGate()"></div>
  <div class="gbox">
    <h3 id="gtitle"></h3>
    <p id="gbody"></p>
    <div class="acts">
      <button class="primary" data-en="Create a free account" data-ar="أنشئ حساباً مجانياً">Create a free account</button>
      <button class="ghost" data-en="I already have one" data-ar="لديّ حساب بالفعل">I already have one</button>
    </div>
  </div>
</div>

<script>
var CATS = [
  {k:"top",             en:"Top stores",     ar:"الأبرز",           ic:"grid_view"},

};

var EXAMPLES = [
  {en:"2 excavators 20t · Qiddiya · 3 months", ar:"حفّارتان ٢٠ طن · القدية · ٣ أشهر"},
  {en:"250 kVA generator · Dhahran · 6 weeks", ar:"مولّد ٢٥٠ ك.ف.أ · الظهران · ٦ أسابيع"},
  {en:"Mobile crane 100t · one lift day", ar:"رافعة ١٠٠ طن · يوم رفع واحد"}
];

var lang = "en", cat = "top", pageIndex = 0, PER = 12, open = null, sheetCat = null;
function L(en, ar){ return lang === "ar" ? ar : en; }
function money(n){ return n.toLocaleString("en-US"); }
function icOf(k){ var c = CATS.filter(function(x){ return x.k === k; })[0]; return c ? c.ic : "construction"; }
function catName(k){ var c = CATS.filter(function(x){ return x.k === k; })[0]; return c ? L(c.en, c.ar) : k; }

function renderExamples(){
  document.getElementById("examples").innerHTML = EXAMPLES.map(function(e){
    return '<button class="ex" onclick="fill(this)">' + L(e.en, e.ar) + '</button>';
  }).join("");
}
function fill(el){ document.getElementById("ask").value = el.textContent.trim(); document.getElementById("ask").focus(); }

function renderCats(){
  document.getElementById("cats").innerHTML = CATS.map(function(c){
    return '<button class="catpill' + (cat === c.k ? " on" : "") + '" onclick="pickCat(\'' + c.k + '\')">' + L(c.en, c.ar) + '</button>';
  }).join("");
}
function pickCat(k){ cat = k; pageIndex = 0; renderCats(); renderGrid(); }

function listFor(k){
  if (k === "top") return STORES.slice();
  return STORES.filter(function(s){ return s.cats[k]; }).sort(function(a,b){ return b.cats[k].n - a.cats[k].n; });
}
function cheapest(s){
  var keys = Object.keys(s.cats);
  return keys.reduce(function(m,x){ return s.cats[x].p < s.cats[m].p ? x : m; }, keys[0]);
}

function renderGrid(){
  var list = listFor(cat), pages = Math.max(1, Math.ceil(list.length / PER));
  if (pageIndex >= pages) pageIndex = 0;
  var from = pageIndex * PER;

  document.getElementById("grid").innerHTML = list.slice(from, from + PER).map(function(s){
    var k = cat === "top" ? null : cat;
    var line = k ? s.cats[k].n + " " + catName(k).toLowerCase() + " · " + L(s.city, s.cityAr)
                 : s.eq + " " + L("machines", "معدّة") + " · " + L(s.city, s.cityAr);
    var p = k ? s.cats[k].p : s.cats[cheapest(s)].p;
    return '<article class="card" onclick="showStore(' + STORES.indexOf(s) + ')">'
      + '<div class="shot"><span class="glyph icon">' + icOf(k || cheapest(s)) + '</span><span class="floor"></span>'
      +   (s.ver ? '<span class="tick"><span class="icon">check</span></span>' : '') + '</div>'
      + '<div class="info"><h3>' + L(s.n, s.nAr) + '</h3><div class="m">' + line + '</div>'
      +   '<div class="p"><span>' + L("from", "من") + '</span> <b>' + money(p) + '</b> <span>SAR / ' + L("mo", "شهر") + '</span></div>'
      + '</div></article>';
  }).join("");

  document.getElementById("title").textContent = cat === "top"
    ? L("Top stores", "المتاجر الأبرز") : L(catName(cat) + " suppliers", "مؤجّرو " + catName(cat));
  document.getElementById("count").textContent = (from + 1) + "–" + Math.min(from + PER, list.length) + " " + L("of", "من") + " " + list.length;
  document.getElementById("prev").disabled = pageIndex === 0;
  document.getElementById("next").disabled = pageIndex >= pages - 1;
}

function page(d){
  var pages = Math.max(1, Math.ceil(listFor(cat).length / PER));
  pageIndex = Math.min(Math.max(0, pageIndex + d), pages - 1);
  renderGrid();
  document.getElementById("stores").scrollIntoView({behavior:"smooth", block:"start"});
}

/* ── store sheet ─────────────────────────────────────────────────────────── */
function showStore(i){
  open = i;
  var s = STORES[i];
  sheetCat = (cat !== "top" && s.cats[cat]) ? cat : Object.keys(s.cats)[0];
  renderSheet();
  document.getElementById("veil").classList.add("on");
  document.getElementById("sheet").classList.add("on");
  document.body.classList.add("locked");
}
function closeStore(){
  open = null;
  document.getElementById("veil").classList.remove("on");
  document.getElementById("sheet").classList.remove("on");
  document.body.classList.remove("locked");
}
function pickSheetCat(k){ sheetCat = k; renderSheet(); }

function renderSheet(){
  if (open === null) return;
  var s = STORES[open], k = sheetCat, sizes = SIZES[k] || ["Standard"], pool = MAKES[k] || [["Generic","Unit"]];

  var chips = Object.keys(s.cats).map(function(x){
    return '<button class="chip' + (x === k ? " on" : "") + '" onclick="pickSheetCat(\'' + x + '\')">'
      + catName(x) + '<span class="c">' + s.cats[x].n + '</span></button>';
  }).join("");

  var n = Math.min(s.cats[k].n, 6), cards = "";
  for (var i = 0; i < n; i++){
    var m = pool[i % pool.length], p = Math.round(s.cats[k].p * (1 + (i % 3) * 0.09));
    cards += '<article class="eq">'
      + '<div class="eqshot"><span class="glyph icon">' + icOf(k) + '</span><span class="floor"></span></div>'
      + '<div class="eqinfo"><h4>' + m[0] + ' ' + m[1] + '</h4>'
      +   '<div class="m">' + sizes[i % sizes.length] + ' · ' + (2019 + (i % 6)) + '</div>'
      +   '<div class="p">' + money(p) + '<span>SAR / ' + L("month", "شهر") + '</span></div>'
      +   '<button class="ask" onclick="gate(\'request\')">' + L("Request this", "اطلبها") + '</button>'
      + '</div></article>';
  }

  document.getElementById("sheet").innerHTML =
      '<div class="sbar"><button class="round back" onclick="closeStore()"><span class="icon">arrow_back</span></button>'
    +   '<span class="t">' + L(s.n, s.nAr) + '</span><span class="spacer"></span>'
    +   '<button class="round" onclick="closeStore()"><span class="icon">close</span></button></div>'
    + '<div class="shead"><span class="slogo">' + L(s.n, s.nAr).trim().charAt(0) + '</span>'
    +   '<div><h2>' + L(s.n, s.nAr) + '</h2><div class="meta">'
    +     '<span><span class="icon">location_on</span>' + L(s.city, s.cityAr) + '</span>'
    +     '<span><span class="icon">inventory_2</span>' + s.eq + ' ' + L("machines", "معدّة") + '</span>'
    +     (s.ver ? '<span style="color:var(--ok)"><span class="icon" style="color:var(--ok)">verified</span>' + L("Verified", "موثّق") + '</span>' : '')
    +   '</div></div></div>'
    + '<div class="sbody"><div class="chips">' + chips + '</div><div class="eqgrid">' + cards + '</div></div>';
}

/* ── gate ────────────────────────────────────────────────────────────────── */
var GATES = {
  request:{tEn:"Create an account to send this", tAr:"أنشئ حساباً لإرساله",
    bEn:"Suppliers price a named site, not an anonymous one. A phone number and a minute — your draft is waiting on the other side.",
    bAr:"المؤجّرون يسعّرون موقعاً معروفاً لا مجهولاً. رقم جوال ودقيقة — ومسوّدتك بانتظارك."},
  signin:{tEn:"Sign in with your phone", tAr:"سجّل الدخول برقم جوالك",
    bEn:"A code arrives by SMS. No password to remember.", bAr:"يصلك رمز عبر رسالة نصية. لا كلمة مرور تتذكّرها."}
};
function gate(kind){
  var g = GATES[kind] || GATES.request;
  document.getElementById("gtitle").textContent = L(g.tEn, g.tAr);
  document.getElementById("gbody").textContent = L(g.bEn, g.bAr);
  document.getElementById("gate").classList.add("on");
  document.body.classList.add("locked");
}
function closeGate(){
  document.getElementById("gate").classList.remove("on");
  if (open === null) document.body.classList.remove("locked");
}
document.addEventListener("keydown", function(e){
  if (e.key !== "Escape") return;
  if (document.getElementById("gate").classList.contains("on")) closeGate();
  else if (open !== null) closeStore();
});

function setLang(l){
  lang = l;
  document.documentElement.setAttribute("lang", l);
  document.documentElement.setAttribute("dir", l === "ar" ? "rtl" : "ltr");
  var nodes = document.querySelectorAll("[data-en]");
  for (var i = 0; i < nodes.length; i++){
    var v = nodes[i].getAttribute(l === "ar" ? "data-ar" : "data-en");
    if (v != null) nodes[i].innerHTML = v;
  }
  var ask = document.getElementById("ask");
  ask.setAttribute("placeholder", ask.getAttribute(l === "ar" ? "data-ph-ar" : "data-ph-en"));
  document.getElementById("loclabel").textContent = l === "ar" ? "العربية" : "English";
  renderExamples(); renderCats(); renderGrid(); if (open !== null) renderSheet();
}

renderExamples();
renderCats();
renderGrid();
</script>
