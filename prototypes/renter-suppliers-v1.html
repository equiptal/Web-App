<!--
  Moedatech — MY SUPPLIERS · v2

  The renter's own supplier repository, and the two emails that go out from it.

  THE MODEL. A row is a LINK between this renter and a supplier — never a field on the supplier's
  own account. The same supplier is a registered vendor for one renter and not for another, so the
  flag lives on the link and nowhere else. A link is either `platform` (it points at a Moedatech
  account and reads that account's name and store live) or `own` (typed or imported from a sheet,
  so the row carries the name and contact itself). Phone in E.164 joins the two worlds — the same
  key the off-platform link bids already use.

  WHY A PLATFORM ROW EXISTS AT ALL. Linking a Moedatech supplier with no intent to register them
  as a vendor buys the renter nothing: Stores already lists them, and bids already arrive without
  any list. So the picker adds them AS registered vendors. That is its whole purpose, and it says
  so. An `own` supplier is different — a sheet import is a contact book first, so its rows start
  unregistered and the renter raises the flag when it is true.

  THE TWO EMAILS ARE NOT THE SAME THING.
    · Share a request — the bid link the app already produces. Any supplier with an email.
    · Invite to Moedatech — the join invitation with the App Store and Google Play links, the same
      text CompanyHub.tsx sends. Off-platform suppliers only; a supplier who already has an
      account has nothing to join.

  SCOPE: email. WhatsApp is out — `wa.me` addresses exactly one number, and real bulk sending needs
  the WhatsApp Business Cloud API with an approved template.

  Matches the app: `RenterSupplier` (src/lib/api/client.ts:1217), `GET /api/renter-suppliers`,
  ShareForBidsSheet.tsx, the link preview from src/app/bid/[token]/page.tsx, and the store links in
  src/lib/config/store-links.ts. The writes it needs do not exist yet.

  Demo data throughout. TODAY is pinned so "3 days ago" stays honest.
-->

<style>
  :root{
    --navy-deep:#16263f; --navy:#1c3550; --navy-mid:#2a4f72;
    --muted-dark:#5a6b82; --muted:#6b8fa8; --muted-light:#9aa7b8;
    --border-strong:#c3d2e0; --border:#d4e0ec;
    --surface3:#e4edf5; --surface2:#eff4f9; --background:#f5f8fc; --surface:#ffffff;
    --brand:#f79009; --brand-hover:#e58108; --brand-press:#cc7207;
    --brand-deep:#b45309; --brand-pale:#fde8cc; --brand-soft:#fff4e5;
    --ok:#1daf58; --ok-soft:#e7f7ee; --ok-deep:#15803d;
    --warn:#d4780a; --warn-soft:#fff3e0; --warn-deep:#8a4f08;
    --danger:#d9362a; --danger-soft:#fcebea; --danger-deep:#b03636;
    --info:#1a7ec8; --info-soft:#e6f2fb; --info-deep:#0e4f7e;
    --t-label:11px; --t-meta:12.5px; --t-body:13px; --t-subhead:15px; --t-title:17px; --t-display:22px;
    --r-sm:2px; --r-md:4px; --r-lg:6px; --r-full:999px;
    --c-sm:30px; --c-md:34px; --c-lg:44px;
    --t:150ms cubic-bezier(.32,.72,.24,1);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--background);color:var(--navy);
    font-family:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:var(--t-body);line-height:1.5;-webkit-font-smoothing:antialiased}
  [dir="rtl"] body{font-family:"IBM Plex Sans Arabic","Nunito",sans-serif}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input,select,textarea{font:inherit;color:inherit}
  a{color:inherit;text-decoration:none}
  h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:800;letter-spacing:-.02em}
  p{margin:0}
  ::selection{background:var(--brand-pale);color:var(--navy)}
  .icon{font-family:"Material Symbols Rounded";line-height:1;display:inline-block;direction:ltr;
    -webkit-font-feature-settings:"liga";user-select:none;font-variation-settings:"opsz" 24,"wght" 400,"FILL" 0}
  .num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
  /* A phone number reads left-to-right even on an Arabic page. */
  .ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){ *,*::before,*::after{transition:none !important} }

  .wrap{max-width:1560px;margin:0 auto;padding:0 16px}
  @media (min-width:640px){ .wrap{padding:0 24px} }
  @media (min-width:1280px){ .wrap{padding:0 32px} }

  /* ── app bar ────────────────────────────────────────────────────────────── */
  .appbar{position:sticky;top:0;z-index:40;height:62px;background:var(--navy);color:#fff;
    display:flex;align-items:center;padding:0 24px;gap:18px}
  .wordmark{display:flex;align-items:center;gap:8px;font-weight:800;font-size:var(--t-title)}
  .wordmark .m{width:var(--c-sm);height:var(--c-sm);border-radius:var(--r-sm);background:#fff;color:var(--navy);
    display:grid;place-items:center;font-size:var(--t-title)}
  .navslot ul{display:flex;gap:4px;list-style:none;margin:0;padding:0}
  .navtab{display:inline-flex;align-items:center;height:var(--c-md);border-radius:var(--r-full);padding:0 16px;
    font-size:var(--t-body);font-weight:600;color:rgba(255,255,255,.72);transition:background var(--t),color var(--t)}
  .navtab:hover{background:rgba(255,255,255,.1);color:#fff}
  .navtab[aria-current="page"]{background:#fff;color:var(--navy);font-weight:800}
  .barright{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
  .langbtn{height:var(--c-sm);border-radius:var(--r-full);padding:0 12px;font-size:var(--t-meta);font-weight:800;
    border:1px solid rgba(255,255,255,.35);color:#fff;transition:background var(--t)}
  .langbtn:hover{background:rgba(255,255,255,.12)}

  /* ── section scaffolding ────────────────────────────────────────────────── */
  .sec{padding:20px 0 40px}
  .shead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .shead .plate{width:38px;height:38px;flex:none;background:var(--navy);color:#fff;
    display:grid;place-items:center;border-radius:var(--r-sm)}
  .shead .plate .icon{font-size:var(--t-display)}
  .shead .txt{min-width:0}
  .shead h2{font-size:var(--t-title)}
  .shead .sum{display:block;color:var(--muted);font-size:var(--t-meta);margin-top:2px}
  .shead .sum b{color:var(--navy);font-weight:800}
  .shead .spacer{flex:1}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--c-md);
    border-radius:var(--r-md);padding:0 14px;font-size:var(--t-body);font-weight:700;
    transition:background var(--t),border-color var(--t),color var(--t)}
  .btn .icon{font-size:var(--t-subhead)}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand-hover)}
  .btn-secondary{background:var(--surface);border:1px solid var(--border-strong);color:var(--navy)}
  .btn-secondary:hover{background:var(--surface2);border-color:var(--navy-mid)}
  /* Tinted, not white: secondary to the orange, but still a button rather than the page with a
     line drawn round it. */
  .btn-tint{background:var(--surface3);border:1px solid var(--border-strong);color:var(--navy)}
  .btn-tint:hover{background:#d7e4f0;border-color:var(--navy-mid)}
  .btn-ghost{color:var(--navy);border:1px solid transparent}
  .btn-ghost:hover{background:var(--surface2)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-danger:hover{background:var(--danger-deep)}
  .btn-sm{height:var(--c-sm);padding:0 11px;font-size:var(--t-meta)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md)}

  /* ── the suggested band ─────────────────────────────────────────────────────
     Suppliers who already bid but hold no link row yet. A suggestion, never an insert. */
  .sugg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 12px;margin-bottom:10px;
    background:var(--info-soft);border:1px solid #bfdcf3;border-radius:var(--r-md);font-size:var(--t-meta)}
  .sugg > .icon{font-size:var(--t-subhead);color:var(--info-deep)}
  .sugg b{font-weight:800}
  .sugg .sgrow{display:flex;gap:6px;flex-wrap:wrap}
  .sgchip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 10px;border-radius:var(--r-full);
    background:var(--surface);border:1px solid #bfdcf3;font-weight:700;font-size:var(--t-meta)}
  .sgchip .add{width:20px;height:20px;border-radius:var(--r-full);display:grid;place-items:center;
    background:var(--info);color:#fff}
  .sgchip .add .icon{font-size:13px;color:#fff}
  .sugg .dismiss{margin-inline-start:auto;color:var(--info-deep);font-weight:700}

  /* ── toolbar ────────────────────────────────────────────────────────────────
     Two pills carry the everyday split. Everything finer lives behind one Filters button, so the
     bar stays a single line whatever the renter is looking for. */
  .tbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--border)}
  .search{display:flex;align-items:center;gap:7px;height:var(--c-sm);min-width:250px;padding:0 10px;
    background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-md)}
  .search .icon{font-size:var(--t-subhead);color:var(--muted)}
  .search input{border:0;background:transparent;outline:none;width:100%;font-size:var(--t-meta);font-weight:600}
  .fchip{display:inline-flex;align-items:center;gap:6px;height:var(--c-sm);border-radius:var(--r-full);padding:0 12px;
    background:var(--surface);border:1px solid var(--border);font-size:var(--t-meta);font-weight:700;color:var(--muted-dark);
    transition:background var(--t),border-color var(--t),color var(--t)}
  .fchip:hover{border-color:var(--navy-mid);color:var(--navy)}
  .fchip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
  .fchip .n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;opacity:.75}
  .fchip .icon{font-size:var(--t-body)}
  .tbar .spacer{flex:1}
  /* The groups menu. A real menu and not a <select>, because each row carries a pen and a bin. */
  .gwrap{position:relative}
  .gmenu{position:absolute;inset-inline-end:0;top:calc(100% + 6px);z-index:50;min-width:260px;
    background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-md);overflow:hidden}
  .gmenu .grow{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 10px;border-bottom:1px solid var(--border)}
  .gmenu .grow:last-child{border-bottom:0}
  .gmenu .grow:hover{background:var(--surface2)}
  .gmenu .nm{flex:1;text-align:start;font-size:var(--t-meta);font-weight:700;padding:4px 0;min-width:0}
  .gmenu .nm .n{color:var(--muted);font-family:"IBM Plex Mono",monospace;margin-inline-start:6px}
  .gmenu .grow[aria-current="true"] .nm{font-weight:800}
  .gmenu .grow[aria-current="true"]{background:var(--surface2);box-shadow:inset 3px 0 0 var(--brand)}
  .gmenu .ic{width:26px;height:26px;flex:none;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--muted)}
  .gmenu .ic:hover{background:var(--surface3);color:var(--navy)}
  .gmenu .ic.del:hover{background:var(--danger-soft);color:var(--danger)}
  .gmenu .ic .icon{font-size:var(--t-body)}
  .gmenu .new{display:flex;align-items:center;gap:7px;width:100%;padding:9px 10px;text-align:start;
    font-size:var(--t-meta);font-weight:800;color:var(--brand-deep);background:var(--brand-soft)}
  .gmenu .new:hover{background:var(--brand-pale)}
  .gmenu .new .icon{font-size:var(--t-subhead)}
  .gback{position:fixed;inset:0;z-index:45}
  .gbtn .icon.caret{font-size:var(--t-subhead);margin-inline-start:2px}

  /* Group chips inside the edit dialog carry their own removal. */
  .gedit{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .gedit .gchip{height:26px;padding:0 4px 0 10px;gap:4px;font-size:var(--t-meta)}
  .gedit .gchip .x{width:18px;height:18px;border-radius:var(--r-full);display:grid;place-items:center;
    color:var(--muted-dark)}
  .gedit .gchip .x:hover{background:var(--border-strong);color:var(--navy)}
  .gedit .gchip .x .icon{font-size:12px}
  .gedit select{height:26px;border:1px dashed var(--border-strong);border-radius:var(--r-full);
    background:transparent;font-size:var(--t-meta);font-weight:700;color:var(--muted-dark);padding:0 6px}
  .fbtn{position:relative}
  .fbtn .badge{position:absolute;top:-5px;inset-inline-end:-5px;min-width:17px;height:17px;padding:0 4px;
    border-radius:var(--r-full);background:var(--brand);color:#fff;font-size:10px;font-weight:800;
    display:grid;place-items:center}

  /* ── selection bar ──────────────────────────────────────────────────────── */
  .selbar{display:none;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 12px;
    background:var(--navy);color:#fff;font-size:var(--t-meta);font-weight:700}
  .selbar.on{display:flex}
  .selbar .spacer{flex:1}
  .selbar .btn-secondary{background:transparent;border-color:rgba(255,255,255,.4);color:#fff}
  .selbar .btn-secondary:hover{background:rgba(255,255,255,.12);border-color:#fff}
  .selbar .clear{color:rgba(255,255,255,.75);font-weight:700}
  .selbar .clear:hover{color:#fff}

  /* ── the table ──────────────────────────────────────────────────────────── */
  table{width:100%;border-collapse:collapse}
  thead th{text-align:start;font-size:var(--t-label);font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--border);background:var(--surface2);
    white-space:nowrap}
  tbody td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--surface2)}
  tbody tr.picked{background:var(--brand-soft)}
  tbody tr.picked:hover{background:var(--brand-pale)}
  .cbox{width:34px}
  .cbox input{width:15px;height:15px;accent-color:var(--brand)}

  .sname{display:flex;align-items:center;gap:9px;min-width:0}
  .avatar{width:30px;height:30px;flex:none;border-radius:var(--r-sm);display:grid;place-items:center;
    background:var(--surface3);color:var(--navy-mid);font-weight:800;font-size:var(--t-meta)}
  .avatar.plat{background:var(--navy);color:#fff}
  .sname .n{display:flex;align-items:center;gap:5px;font-weight:800;font-size:var(--t-body);text-align:start}
  .sname .n .open{border-bottom:1px solid var(--border-strong)}
  .sname .n:hover .open{border-bottom-color:var(--navy)}
  .sname .n .icon{font-size:var(--t-body);color:var(--muted-light)}
  .sname .c{display:block;color:var(--muted);font-size:var(--t-meta)}
  /* The source used to be a filled pill in a column of its own. The avatar already carries it —
     navy for an account, grey for one of the renter's own — so the word only has to confirm. */
  .sname .c .where{color:var(--muted-light);font-weight:700}
  .sname .c .where.plat{color:var(--navy-mid)}

  /* One badge, one question: does this supplier have a Moedatech account. */
  .src{display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 9px;border-radius:var(--r-full);
    font-size:var(--t-label);font-weight:800;border:1px solid transparent;white-space:nowrap}
  .src .icon{font-size:13px}
  .src-plat{background:var(--navy);color:#fff}
  .src-off{background:var(--surface2);color:var(--muted-dark);border-color:var(--border-strong)}

  /* The vendor flag is a control, not a label. In the table it is an icon — the column header says
     the word once, so the row does not have to say it six times. */
  .vtog{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:var(--r-full);
    border:1px dashed var(--border-strong);background:var(--surface);color:var(--muted);
    font-size:var(--t-label);font-weight:800;transition:var(--t)}
  .vtog:hover{border-color:var(--navy-mid);color:var(--navy)}
  .vtog .icon{font-size:14px}
  .vtog[aria-pressed="true"]{border-style:solid;border-color:var(--ok);background:var(--ok-soft);color:var(--ok-deep)}
  .vmark{width:26px;height:26px;border-radius:var(--r-full);display:grid;place-items:center;
    color:var(--muted-light);border:1px dashed var(--border-strong);transition:var(--t)}
  .vmark:hover{border-color:var(--navy-mid);color:var(--navy)}
  .vmark .icon{font-size:var(--t-subhead)}
  .vmark[aria-pressed="true"]{border-style:solid;border-color:var(--ok);background:var(--ok-soft);color:var(--ok-deep)}

  .contact{display:block;font-size:var(--t-meta)}
  .contact .em{display:block;font-weight:700}
  .contact .ph{display:block;color:var(--muted)}
  .contact .missing{color:var(--muted-dark);font-weight:700}
  .contact .addem{color:var(--info-deep);font-weight:800;border-bottom:1px solid #bfdcf3}

  /* A group is a label, and a label is text. */
  .gtext{display:block;font-size:var(--t-meta);color:var(--muted-dark);font-weight:700}
  .gtext.none{color:var(--muted-light);font-weight:600}

  .gchips{display:flex;gap:4px;flex-wrap:wrap}
  .gchip{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:var(--r-full);
    background:var(--surface3);color:var(--navy-mid);font-size:var(--t-label);font-weight:800}
  .gchip.none{background:transparent;color:var(--muted-light);border:1px dashed var(--border-strong)}

  /* The relationship cell. One word for how far this has gone, the dots that grade it, the link
     count kept separate because it answers a different question, and the numbers underneath so the
     word is never something the renter has to take on trust. */
  .relcell{display:block;text-align:start}
  .relcell .top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  /* Underlined because it opens something — the row does too, but the count is where the eye goes. */
  .relcell .word{font-weight:800;font-size:var(--t-body);white-space:nowrap;
    text-decoration:underline;text-decoration-color:var(--border-strong);text-underline-offset:2px}
  .relcell:hover .word{text-decoration-color:var(--navy)}
  .relcell .sub{display:block;color:var(--muted);font-size:var(--t-label);font-weight:700;margin-top:2px}
  .relcell .sub .aw{color:var(--brand-deep);font-weight:800}

  /* One badge per channel. They count the same bids two ways, so they read the same and differ only
     in colour — the app is the house style, the link is the green of everything off-platform. */
  .bg{display:inline-flex;align-items:center;gap:4px;flex:none;height:19px;padding:0 8px;line-height:1;
    border-radius:var(--r-full);font-size:var(--t-label);font-weight:800;white-space:nowrap;
    border:1px solid transparent}
  .bg .icon{font-size:12px}
  .bg-app{background:var(--navy);color:#fff}
  .bg-link{background:var(--ok-soft);color:var(--ok-deep);border-color:#b9e5cb}
  .bg-award{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--brand-pale)}
  .dots{display:inline-flex;gap:3px;flex:none}
  .dots i{width:7px;height:7px;border-radius:var(--r-full);background:var(--surface3);
    border:1px solid var(--border-strong);display:block}
  .dots i.on{background:var(--navy);border-color:var(--navy)}
  .dots.core i.on{background:var(--ok-deep);border-color:var(--ok-deep)}
  .dots.quiet i.on{background:var(--muted-light);border-color:var(--muted-light)}
  /* The link count is a channel, not a rank — it stays a chip and never joins the meter. */
  .linkcnt{display:inline-flex;align-items:center;gap:4px;flex:none;height:19px;padding:0 7px;line-height:1;
    border-radius:var(--r-full);background:var(--ok-soft);color:var(--ok-deep);border:1px solid #b9e5cb;
    font-size:var(--t-label);font-weight:800;white-space:nowrap}
  .linkcnt .icon{font-size:12px}
  /* NEW pulses. A bid that landed while the renter was elsewhere should be the one thing on the row
     that moves — and nothing else on this screen animates, so it cannot be missed or mistaken. */
  .newpill{display:inline-flex;align-items:center;flex:none;height:19px;padding:0 8px;line-height:1;
    border-radius:var(--r-full);background:var(--brand);color:#fff;font-size:10px;font-weight:800;
    letter-spacing:.04em;animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(247,144,9,.55) }
    50%    { box-shadow:0 0 0 5px rgba(247,144,9,0) }
  }
  @media (prefers-reduced-motion:reduce){ .newpill{animation:none} }
  .via{display:inline-flex;flex:none;align-items:center;gap:4px;height:20px;padding:0 8px;line-height:1;
    border-radius:var(--r-full);font-size:var(--t-label);font-weight:800;white-space:nowrap}
  .via .icon{font-size:12px}
  .via-app{background:var(--navy);color:#fff}
  .via-link{background:var(--ok-soft);color:var(--ok-deep);border:1px solid #b9e5cb}
  .none{color:var(--muted-light);font-size:var(--t-meta)}

  /* The bid list inside the relation sheet, and the list of what the renter sent. */
  .bidlist{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
  .bidrow{display:flex;align-items:center;gap:10px;padding:9px 11px;border-bottom:1px solid var(--border)}
  .bidrow:last-child{border-bottom:0}
  .bidrow.fresh{background:var(--brand-soft)}
  .bidrow .t{flex:1;min-width:0}
  .bidrow .t b{display:flex;align-items:center;gap:6px;font-size:var(--t-body);font-weight:800}
  .bidrow .t > span{display:block;font-size:var(--t-meta);color:var(--muted)}
  .bidrow .money{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:var(--t-meta);white-space:nowrap}
  .sent{display:grid;gap:0}
  .sentrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
  .sentrow:last-child{border-bottom:0}
  .sentrow .dot{width:22px;height:22px;flex:none;border-radius:var(--r-full);display:grid;place-items:center;
    background:var(--surface3);color:var(--navy-mid)}
  .sentrow .dot .icon{font-size:13px}
  .sentrow .t{flex:1;min-width:0}
  .sentrow .t b{display:block;font-weight:700;font-size:var(--t-body)}
  .sentrow .t > span{display:block;font-size:var(--t-meta);color:var(--muted)}
  .sentrow .when{font-size:var(--t-label);color:var(--muted-light);font-weight:700;white-space:nowrap}

  .rowacts{display:flex;align-items:center;gap:2px;justify-content:flex-end}
  .iact{width:var(--c-sm);height:var(--c-sm);border-radius:var(--r-sm);display:grid;place-items:center;
    color:var(--muted);transition:var(--t)}
  .iact:hover{background:var(--surface3);color:var(--navy)}
  .iact.del:hover{background:var(--danger-soft);color:var(--danger)}
  .iact .icon{font-size:var(--t-subhead)}
  .iact[disabled]{opacity:.28;cursor:not-allowed}

  .empty{padding:34px 16px;text-align:center;color:var(--muted)}
  .empty .icon{font-size:32px;color:var(--muted-light);display:block;margin-bottom:6px}
  .empty b{display:block;color:var(--navy);font-size:var(--t-subhead);margin-bottom:3px}


  /* ── dialogs ────────────────────────────────────────────────────────────── */
  .scrim{position:fixed;inset:0;z-index:60;background:rgba(28,53,80,.45);display:none;
    align-items:center;justify-content:center;padding:20px;overflow:auto}
  .scrim.open{display:flex}
  .modal{width:100%;max-width:620px;background:var(--surface);border-radius:var(--r-lg);overflow:hidden}
  .modal.wide{max-width:860px}
  .mhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
  .mhead .plate{width:32px;height:32px;flex:none;border-radius:var(--r-sm);background:var(--brand-soft);
    color:var(--brand-deep);display:grid;place-items:center}
  .mhead h3{font-size:var(--t-subhead)}
  .mhead .sub{display:block;font-size:var(--t-meta);color:var(--muted);font-weight:600}
  .mhead .x{margin-inline-start:auto;width:var(--c-sm);height:var(--c-sm);border-radius:var(--r-sm);
    display:grid;place-items:center;color:var(--muted)}
  .mhead .x:hover{background:var(--surface2);color:var(--navy)}
  .mbody{padding:16px 18px;display:grid;gap:14px;max-height:66vh;overflow-y:auto;overflow-x:hidden}
  /* Grid items default to min-width:auto, which lets a wide child push its own siblings out of the
     clipped body. Nothing in a dialog may do that. */
  .mbody > *{min-width:0}
  .mfoot{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:12px 18px;
    border-top:1px solid var(--border);background:var(--surface2);flex-wrap:wrap}
  .mfoot .spacer{flex:1}
  .mfoot .note{font-size:var(--t-meta);color:var(--muted);font-weight:600}

  .field{display:grid;gap:5px}
  .field > label{font-size:var(--t-label);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .field .req{color:var(--danger)}
  .field input,.field select,.field textarea{height:var(--c-md);border:1px solid var(--border-strong);
    border-radius:var(--r-md);padding:0 10px;font-size:var(--t-body);background:var(--surface)}
  .field textarea{height:auto;padding:8px 10px;line-height:1.5}
  .field input:focus,.field select:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
  .field .hint{font-size:var(--t-meta);color:var(--muted)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:560px){ .grid2{grid-template-columns:1fr} }

  .note{display:flex;gap:8px;align-items:flex-start;padding:9px 11px;border-radius:var(--r-md);
    font-size:var(--t-meta);line-height:1.45}
  .note .icon{font-size:var(--t-subhead);flex:none}
  .note.info{background:var(--info-soft);color:var(--info-deep)}
  .note.warn{background:var(--danger-soft);color:var(--danger-deep)}
  .note.calm{background:var(--surface2);color:var(--muted-dark)}
  .note.good{background:var(--ok-soft);color:var(--ok-deep);align-items:center}

  .plist{border:1px solid var(--border);border-radius:var(--r-md);max-height:300px;overflow:auto}
  .prow{display:flex;align-items:center;gap:10px;padding:8px 11px;border-bottom:1px solid var(--border);
    text-align:start;width:100%}
  .prow:last-child{border-bottom:0}
  .prow:hover{background:var(--surface2)}
  .prow input[type="checkbox"]{width:15px;height:15px;accent-color:var(--brand);flex:none}
  .prow .t{min-width:0;flex:1}
  .prow .t b{display:block;font-size:var(--t-body);font-weight:800}
  .prow .t > span{display:block;font-size:var(--t-meta);color:var(--muted)}
  .prow .have{font-size:var(--t-label);font-weight:800;color:var(--ok-deep);
    background:var(--ok-soft);border-radius:var(--r-full);padding:1px 8px}

  /* The filter sheet — every narrowing the list can do, in one place. */
  .fgroup{display:grid;gap:6px}
  .fgroup .k{font-size:var(--t-label);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .fopts{display:flex;gap:6px;flex-wrap:wrap}
  .fopt{display:inline-flex;align-items:center;gap:7px;height:var(--c-md);border-radius:var(--r-md);padding:0 12px;
    border:1px solid var(--border-strong);background:var(--surface);font-size:var(--t-meta);font-weight:700}
  .fopt:hover{border-color:var(--navy-mid)}
  .fopt[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:#fff}
  .fopt .n{font-family:"IBM Plex Mono",monospace;opacity:.7}

  /* Type as many as you like. One grid, one header, a row per supplier. */
  .rows{display:grid;gap:6px}
  .rowhead,.rowline{display:grid;grid-template-columns:1.2fr .9fr 1.2fr .9fr auto 28px;gap:6px;align-items:center}
  .rowhead span{font-size:var(--t-label);font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted)}
  .rowhead .req{color:var(--danger)}
  .rowline input{height:var(--c-sm);border:1px solid var(--border-strong);border-radius:var(--r-md);
    padding:0 9px;font-size:var(--t-meta);background:var(--surface);width:100%}
  .rowline input:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
  .rowline .x{width:26px;height:26px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--muted)}
  .rowline .x:hover{background:var(--danger-soft);color:var(--danger)}
  .rowline .x .icon{font-size:var(--t-body)}
  .rowline .x[disabled]{opacity:.25;cursor:not-allowed}
  .addrow{display:inline-flex;align-items:center;gap:6px;height:var(--c-sm);padding:0 11px;border-radius:var(--r-md);
    border:1px dashed var(--border-strong);color:var(--muted-dark);font-size:var(--t-meta);font-weight:800;
    justify-self:start}
  .addrow:hover{border-color:var(--navy-mid);color:var(--navy);background:var(--surface2)}
  .addrow .icon{font-size:var(--t-subhead)}

  /* The sheet is an alternative, not a tab — so it announces itself with a rule and a single button. */
  .orline{display:flex;align-items:center;gap:12px;color:var(--muted-light);font-size:var(--t-label);
    font-weight:800;text-transform:uppercase;letter-spacing:.06em}
  .orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--border)}
  .filecard{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border-strong);

  .filecard b{display:block;font-size:var(--t-body)}
  .filecard span{display:block;font-size:var(--t-meta);color:var(--muted)}

  .vcheck{display:flex;align-items:flex-start;gap:9px;padding:10px 11px;border-radius:var(--r-md);

  .vcheck b{display:block;font-weight:800}
  .vcheck span{display:block;color:var(--muted-dark)}

  .maptbl{width:100%}
  .maptbl th,.maptbl td{padding:7px 10px;font-size:var(--t-meta)}
  .maptbl select{height:var(--c-sm);border:1px solid var(--border-strong);border-radius:var(--r-md);padding:0 8px;

  .maptbl .kept{font-size:var(--t-label);font-weight:800;color:var(--muted-dark);

  .prev td,.prev th{white-space:nowrap;font-size:var(--t-meta);padding:6px 10px}
  .drop{border:1px dashed var(--border-strong);border-radius:var(--r-md);padding:20px;text-align:center;
    color:var(--muted);background:var(--surface2)}
  .drop .icon{font-size:28px;display:block;margin-bottom:4px;color:var(--muted-light)}
  .drop b{color:var(--navy)}

  /* The email preview. Deliberately plain: it is the message the supplier receives. */
  .mail{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
  .mailhead{padding:9px 12px;border-bottom:1px solid var(--border);background:var(--surface2);font-size:var(--t-meta)}
  .mailhead .l{display:flex;gap:8px;padding:1px 0}
  .mailhead .k{width:64px;flex:none;color:var(--muted);font-weight:800;text-transform:uppercase;font-size:var(--t-label);

  .mailhead .v{font-weight:700;min-width:0}
  .mailbody{padding:14px 16px;font-size:var(--t-meta);line-height:1.6;display:grid;gap:11px}
  .lcard{border:1px solid var(--border-strong);border-radius:var(--r-md);overflow:hidden}

  .lcard .top .plate{width:34px;height:34px;flex:none;border-radius:var(--r-sm);background:rgba(255,255,255,.16);
    display:grid;place-items:center}
  .lcard .top b{display:block;font-size:var(--t-body)}
  .lcard .top span{display:block;font-size:var(--t-label);color:rgba(255,255,255,.75);font-weight:700}
  .lcard .rows{padding:10px 12px;display:grid;gap:5px;background:var(--surface)}
  .lcard .r{display:flex;gap:8px;font-size:var(--t-meta)}
  .lcard .r .k{width:96px;flex:none;color:var(--muted);font-weight:700}
  .lcard .r .v{font-weight:800}
  .lcard .foot{padding:8px 12px;border-top:1px solid var(--border);color:var(--muted);font-size:var(--t-label);
    background:var(--surface2);font-weight:700}
  .cta{display:inline-flex;align-items:center;justify-content:center;height:var(--c-md);border-radius:var(--r-md);

  .stores{display:flex;gap:8px;flex-wrap:wrap}
  .sbadge{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:var(--r-md);
    background:var(--navy);color:#fff;font-weight:700;font-size:var(--t-meta)}
  .sbadge > .icon{font-size:var(--t-title)}
  .sbadge b{display:block;font-size:var(--t-body)}
  .sbadge i{display:block;font-size:10px;font-style:normal;color:rgba(255,255,255,.7)}

  /* The relation sheet — the renter's history with one supplier. */
  /* The grade strip at the top of the bids sheet: dots, word, and the reason in the same breath. */
  .grade{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--border);
    border-radius:var(--r-md);background:var(--surface2)}
  .grade .w b{display:block;font-size:var(--t-subhead);font-weight:800}
  .grade .w span{display:block;font-size:var(--t-meta);color:var(--muted)}
  .grade .q{color:var(--muted-light);font-weight:700}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  @media (max-width:560px){ .kpis{grid-template-columns:repeat(2,1fr)} }
  .kpi{border:1px solid var(--border);border-radius:var(--r-md);padding:9px 11px;background:var(--surface2)}
  .kpi b{display:block;font-size:var(--t-title);font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
  .kpi b.words{font-family:inherit;font-size:var(--t-subhead);font-weight:800}
  .kpi span{display:block;font-size:var(--t-label);font-weight:800;text-transform:uppercase;letter-spacing:.05em;
    color:var(--muted)}
  .tl{display:grid;gap:0}
  .tlrow{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);align-items:flex-start}
  .tlrow:last-child{border-bottom:0}
  .tlrow .dot{width:22px;height:22px;flex:none;border-radius:var(--r-full);display:grid;place-items:center;
    background:var(--surface3);color:var(--navy-mid)}
  .tlrow .dot.link{background:var(--ok-soft);color:var(--ok-deep)}
  .tlrow .dot .icon{font-size:13px}
  .tlrow .t{flex:1;min-width:0}
  .tlrow .t b{display:block;font-size:var(--t-body);font-weight:700}
  .tlrow .t span{display:block;font-size:var(--t-meta);color:var(--muted)}
  .tlrow .when{font-size:var(--t-label);color:var(--muted-light);font-weight:700;white-space:nowrap;padding-top:3px}
  .tlrow .go{font-size:var(--t-meta);font-weight:800;color:var(--info-deep)}
  .xtra{display:grid;gap:4px}
  .xtra .x{display:flex;gap:8px;font-size:var(--t-meta);padding:3px 0;border-bottom:1px dashed var(--border)}
  .xtra .x:last-child{border-bottom:0}
  .xtra .x .k{width:150px;flex:none;color:var(--muted);font-weight:700}

  .toast{position:fixed;inset-inline-start:50%;transform:translateX(-50%);bottom:22px;z-index:80;
    background:var(--navy-deep);color:#fff;border-radius:var(--r-md);padding:10px 15px;font-size:var(--t-meta);

  .toast.on{display:flex}
  .toast .icon{font-size:var(--t-subhead);color:var(--ok)}
</style>
</head>

var ar = false;
function L(en, arr){ return ar ? arr : en; }
function toggleLang(){
  ar = !ar;
  document.documentElement.lang = ar ? "ar" : "en";
  document.documentElement.dir  = ar ? "rtl" : "ltr";
  document.getElementById("langbtn").textContent = ar ? "English" : "العربية";
  render();
}
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
  return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; }); }

var TODAY = new Date("2026-08-31T09:00:00");
function ago(iso){
  if (!iso) return null;
  var days = Math.floor((TODAY - new Date(iso)) / 86400000);
  if (days <= 0) return L("today", "اليوم");
  if (days === 1) return L("yesterday", "أمس");
  if (days < 30) return L(days + " days ago", "قبل " + days + " يوم");
  var m = Math.floor(days / 30);
  return m === 1 ? L("last month", "الشهر الماضي") : L(m + " months ago", "قبل " + m + " أشهر");
}

/* ══ helpers ════════════════════════════════════════════════════════════════ */
function name(s){ return L(s.nEn, s.nAr); }
function byId(id){ for (var i=0;i<SUPPLIERS.length;i++) if (SUPPLIERS[i].id===id) return SUPPLIERS[i]; return null; }
function hasEmail(s){ return !!(s.email && s.email.trim()); }
function appBids(s){ return s.bids.filter(function(b){ return b.via === "app"; }).length; }
function linkBids(s){ return s.bids.filter(function(b){ return b.via === "link"; }).length; }
function newBids(s){ return s.bids.filter(function(b){ return b.unseen; }).length; }
function lastBid(s){ return s.bids.length ? s.bids[0].when : null; }
function bidOnPlatform(s){ return appBids(s) > 0; }
function bidViaLink(s){ return linkBids(s) > 0; }
/* How far this relationship has gone, off two facts the app already holds: did they bid, and did
   you award them. Four states, one modifier, no score — a number nobody can explain is worse than
   no signal. `quiet` dims the dots instead of demoting the word: a core vendor who has gone silent
   is still a core vendor. */
function tier(s){
  var days = lastBid(s) ? Math.floor((TODAY - new Date(lastBid(s))) / 86400000) : null;
  var quiet = days != null && days > 180;
  if (!s.bids.length)  return { key:"new",     label:L("New", "جديد"),      dots:0, quiet:false };
  if (s.awards >= 2)   return { key:"core",    label:L("Core", "أساسي"),     dots:3, quiet:quiet };
  if (s.awards === 1)  return { key:"working", label:L("Working", "قائم"),   dots:2, quiet:quiet };
  return                      { key:"bidding", label:L("Bidding", "يزايد"),  dots:1, quiet:quiet };
}
/* What the renter sent versus what came back — the plainest measure of whether this supplier
   answers. Counted, never averaged into the word above. */
function sharesSent(s){ return s.sent.filter(function(e){ return e.kind === "share"; }).length; }

/* Opening the relation sheet is what marks a supplier's new bids as seen. */
function markSeen(s){ s.bids.forEach(function(b){ b.unseen = false; }); }
function allGroups(){
  var seen = {}, out = [];
  SUPPLIERS.forEach(function(s){ s.groups.forEach(function(g){ if (!seen[g]) { seen[g] = 1; out.push(g); } }); });
  return out.sort();
}
function initials(s){
  var w = s.nEn.replace(/[^A-Za-z ]/g, "").trim().split(/\s+/);
  return ((w[0] || "?")[0] + (w[1] ? w[1][0] : "")).toUpperCase();
}

var q = "";
var pill = "all";                 /* all | vendor */
var F = { where:"", bid:"" };     /* where: platform|off · bid: platform|link|none */
var groupFilter = "";
var picked = {};
/* The checkbox column exists only while a group is being made. */
var selectMode = false;
var menuOpen = false;

function activeFilters(){ return (F.where ? 1 : 0) + (F.bid ? 1 : 0) + (groupFilter ? 1 : 0); }

function visible(){
  var needle = q.trim().toLowerCase();
  return SUPPLIERS.filter(function(s){
    if (needle && (s.nEn + " " + s.nAr + " " + (s.contact||"") + " " + (s.email||"") + " " + (s.phone||""))
        .toLowerCase().indexOf(needle) === -1) return false;
    if (pill === "vendor" && !s.vendor) return false;
    if (groupFilter && s.groups.indexOf(groupFilter) === -1) return false;
    if (F.where === "platform" && s.kind !== "platform") return false;
    if (F.where === "off"      && s.kind !== "own") return false;
    if (F.bid === "platform" && !bidOnPlatform(s)) return false;
    if (F.bid === "link"     && !bidViaLink(s)) return false;
    /* A supplier can match both — an account holder who also used the link. Each filter asks about
       one channel and neither excludes the other. */
    return true;
  });
}
function pickedList(){ return SUPPLIERS.filter(function(s){ return picked[s.id]; }); }

    + '</div>';

function row(s){
  var id = s.id;
  var off = s.kind === "own";
  /* The row opens the sheet, EXCEPT where a control already owns the click — the vendor toggle,
     add-an-email, the icon actions, the checkbox. `closest` is what keeps those honest. */
  return '<tr class="' + (picked[id] ? "picked" : "") + '" onclick="rowOpen(event,\'' + id + '\')">'
    + (selectMode
      ? '<td class="cbox"><input type="checkbox" ' + (picked[id] ? "checked" : "") + ' onchange="pickOne(\'' + id + '\',this.checked)" '
        + 'aria-label="' + esc(name(s)) + '" /></td>'
      : "")

    /* The name opens the relation sheet — the history numbers live there, not in a column. */
    + '<td><span class="sname">'
    +   '<span class="avatar' + (off ? "" : " plat") + '">' + initials(s) + '</span>'
    +   '<span style="min-width:0">'
    +     '<button class="n" onclick="dlgSupplier(\'' + id + '\')">'
    +       '<span class="open">' + esc(name(s)) + '</span>'
    +       '<span class="icon" aria-hidden="true">open_in_full</span></button>'
    +     '<span class="c">' + esc(s.contact || L("no contact name", "بدون اسم جهة اتصال")) + '</span>'
    +   '</span></span></td>'

    /* Whether they have a Moedatech account. Its own column, because it governs what the rest of
       the row can even mean. */
    + '<td>' + (off
        ? '<span class="src src-off">' + L("Off platform", "خارج المنصة") + '</span>'
        : '<span class="src src-plat"><span class="icon" aria-hidden="true">verified_user</span>'
          + L("On Moedatech", "على مويداتك") + '</span>') + '</td>'

    /* The renter's own flag, and a control rather than a label — so it keeps its word. */
    + '<td><button class="vtog" aria-pressed="' + s.vendor + '" onclick="toggleVendor(\'' + id + '\')">'
    +   '<span class="icon" aria-hidden="true">' + (s.vendor ? "verified" : "add") + '</span>'
    +   (s.vendor ? L("Registered", "معتمد") : L("Mark", "تعيين")) + '</button></td>'

    + '<td><span class="contact">'
    +   (hasEmail(s)
        ? '<span class="em">' + esc(s.email) + '</span>'
        : '<span class="missing">' + L("No email", "بدون بريد") + ' — <button class="addem" onclick="dlgAddEmail(\'' + id + '\')">'
          + L("add", "أضف") + '</button></span>')
    +   '<span class="ph"><span class="num ltr">' + esc(s.phone || "—") + '</span></span>'
    + '</span></td>'

    + '<td><span class="gtext' + (s.groups.length ? "" : " none") + '">'
    +   (s.groups.length ? esc(s.groups.join(" · ")) : L("no group", "بلا مجموعة")) + '</span></td>'

    + '<td><span class="rowacts">'
    +   '<button class="iact" title="' + L("Share a request", "مشاركة طلب") + '" '
    +     (hasEmail(s) ? 'onclick="shareOne(\'' + id + '\')"' : "disabled")
    +     '><span class="icon" aria-hidden="true">share</span></button>'
    +   '<button class="iact" title="' + L("Invite to Moedatech", "دعوة للانضمام لمويداتك") + '" '
    +     (off && hasEmail(s) ? 'onclick="dlgJoinInvite(\'' + id + '\')"' : "disabled")
    +     '><span class="icon" aria-hidden="true">person_add</span></button>'
    +   '<button class="iact" title="' + L("Edit", "تعديل") + '" onclick="dlgSupplierForm(\'' + id + '\')">'
    +     '<span class="icon" aria-hidden="true">edit</span></button>'
    +   '<button class="iact del" title="' + L("Remove", "إزالة") + '" onclick="dlgRemove(\'' + id + '\')">'
    +     '<span class="icon" aria-hidden="true">close</span></button>'
    + '</span></td></tr>';

/* The count in the row's own weight; the split, the awards and the date in the muted sub-line.
   NEW stays a filled badge because it is the only thing here that needs to interrupt. */
function relCell(s){
  var a = appBids(s), l = linkBids(s), n = newBids(s);

  if (!s.bids.length) {
    return '<button class="relcell" onclick="dlgBids(\'' + s.id + '\')">'
      + '<span class="top"><span class="word" style="color:var(--muted-light)">'
      +   L("No bids yet", "لا عروض بعد") + '</span></span>'
      + '<span class="sub">' + (sharesSent(s)
          ? sharesSent(s) + " " + L("shared · no answer", "طلب مُشارَك · بلا رد")
          : L("nothing shared with them yet", "لم تُشارك معهم شيئاً بعد")) + '</span></button>';
  }

  var bits = [];
  if (a) bits.push(a + " " + L("on Moedatech", "على مويداتك"));
  if (l) bits.push(l + " " + L("via link", "عبر الرابط"));
  if (s.awards) bits.push('<span class="aw">' + s.awards + " " + L("awarded", "ترسية") + '</span>');
  bits.push(ago(lastBid(s)));

  return '<button class="relcell" onclick="dlgBids(\'' + s.id + '\')">'
    + '<span class="top">'
    +   '<span class="word">' + s.bids.length + " "
    +     (s.bids.length === 1 ? L("bid", "عرض") : L("bids", "عروض")) + '</span>'
    +   (n ? '<span class="newpill">' + n + " " + L("NEW", "جديد") + '</span>' : "")
    + '</span>'
    + '<span class="sub">' + bits.join(" · ") + '</span></button>';
}

/* No legend. The badges carry their own words — "3 on Moedatech", "1 via link", "2 awarded",
   "NEW" — and a strip explaining labels that already explain themselves is a row of the screen
   spent saying nothing. */

function refocus(){
  var el = document.getElementById("q");
  if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

/* ══ row actions ════════════════════════════════════════════════════════════ */
function rowOpen(e, id){
  if (e.target.closest("button, input, select, a")) return;
  dlgSupplier(id);
}
function pickOne(id, on){ if (on) picked[id] = true; else delete picked[id]; render(); }
function pickAll(on){
  visible().forEach(function(s){ if (on) picked[s.id] = true; else delete picked[s.id]; });
  render();
}
/* The bids cell opens the bids sheet; the name opens the profile. Two doors, two jobs. */
/* Out to the real thing: this supplier's bid, inside its request, where it can be compared,
   negotiated and awarded. Nothing about a bid is decided from the suppliers list. */
function goToBid(id, i){
  var b = byId(id).bids[i];
  toast(L("Opens " + b.reqEn + " in Requests, at this supplier's bid",
          "يفتح " + b.reqAr + " في الطلبات، عند عرض هذا المورّد"));
}

/* The flag is written on the link row. The supplier is not told, and another renter's view of the
   same supplier does not change. */
function toggleVendor(id){
  var s = byId(id);
  s.vendor = !s.vendor;
  toast(s.vendor
    ? L(name(s) + " is a registered vendor", name(s) + " أصبح مورّداً معتمداً")
    : L(name(s) + " is no longer a registered vendor", name(s) + " لم يعد مورّداً معتمداً"));
  render();
}

function acceptSuggestion(key){
  var g = null;
  for (var i=0;i<SUGGESTED.length;i++) if (SUGGESTED[i].key === key) g = SUGGESTED[i];
  if (!g) return;
  var platform = g.kind === "platform";
  SUPPLIERS.push({
    id:"l" + (SUPPLIERS.length + 1), kind:g.kind, supplierId:g.supplierId || null, store:false,

/* ══ dialog plumbing ════════════════════════════════════════════════════════ */
function openModal(html){
  var s = document.getElementById("scrim");
  s.innerHTML = html;
  s.classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  var s = document.getElementById("scrim");
  s.classList.remove("open");
  s.innerHTML = "";
  document.body.style.overflow = "";
}
function mhead(icon, title, sub){
  return '<div class="mhead"><span class="plate"><span class="icon" aria-hidden="true">' + icon + '</span></span>'
    + '<span><h3>' + title + '</h3>' + (sub ? '<span class="sub">' + sub + '</span>' : "") + '</span>'
    + '<button class="x" onclick="closeModal()" aria-label="' + L("Close", "إغلاق") + '">'
    + '<span class="icon" aria-hidden="true">close</span></button></div>';
}
function toast(msg){
  var t = document.getElementById("toast");
  t.innerHTML = '<span class="icon" aria-hidden="true">check_circle</span>' + esc(msg);
  t.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove("on"); }, 2800);
}

function dlgDirectory(){

    +     '<span>' + L("On by default — untick any supplier below to add them without the flag. Their name, store and equipment stay theirs, and they are not told either way.",
                       "مفعّل افتراضياً — أزل التحديد عن أي مورّد أدناه لإضافته بدون العلامة. الاسم والمتجر والمعدات تبقى لهم، ولا يتم إخبارهم في الحالتين.")
    +     '</span></span></label>'

    +   '<button class="btn btn-primary" onclick="saveDirectory()">'

function renderDirectory(){
  var el = document.getElementById("dq");
  var needle = (el ? el.value : "").trim().toLowerCase();
  var have = {};
  SUPPLIERS.forEach(function(s){ if (s.supplierId) have[s.supplierId] = true; });
  var list = DIRECTORY.filter(function(d){
    return !needle || (d.nEn + " " + d.nAr + " " + d.city).toLowerCase().indexOf(needle) !== -1;
  });
  document.getElementById("dlist").innerHTML = '<div class="plist">' + list.map(function(d){
    var already = have[d.supplierId];
    return '<label class="prow">'
      + '<input type="checkbox" ' + (already ? "disabled" : "")

      +   ' onchange="dirPick[\'' + d.supplierId + '\']=this.checked;renderDirectory()" />'
      + '<span class="t"><b>' + esc(L(d.nEn, d.nAr)) + '</b><span>' + esc(d.city)
      +   " · " + d.eq + " " + L("machines", "معدة")
      +   (d.store ? " · " + L("has a store", "لديه متجر") : "") + '</span></span>'
      + (already ? '<span class="have">' + L("in your list", "في قائمتك") + '</span>'
        : dirPick[d.supplierId]
          ? '<label class="vtick' + (dirVend[d.supplierId] !== false ? " on" : "") + '">'
            + '<input type="checkbox" ' + (dirVend[d.supplierId] !== false ? "checked" : "")
            +   ' onchange="event.stopPropagation();dirVend[\'' + d.supplierId + '\']=this.checked;renderDirectory()" />'
            + L("Registered", "معتمد") + '</label>'

      + '</label>';

    ? n + " " + L("selected", "محدَّد")
    : L("Nothing selected yet", "لم يتم التحديد بعد");

function setAllDirVendors(on){
  DIRECTORY.forEach(function(d){ dirVend[d.supplierId] = on; });
  renderDirectory();
}
function saveDirectory(){
  var added = 0;
  DIRECTORY.forEach(function(d){
    if (!dirPick[d.supplierId]) return;
    SUPPLIERS.push({
      id:"l" + (SUPPLIERS.length + 1 + added), kind:"platform", supplierId:d.supplierId, store:d.store,
      nEn:d.nEn, nAr:d.nAr, contact:null, email:null, phone:null,
      vendor:dirVend[d.supplierId] !== false, groups:[], source:"platform",
      rooms:0, awards:0, bids:[], sent:[]
    });
    added++;
  });
  if (!added) { toast(L("Nothing selected", "لم يتم التحديد")); return; }
  closeModal();
  var v = DIRECTORY.filter(function(d){ return dirPick[d.supplierId] && dirVend[d.supplierId] !== false; }).length;
  toast(v === added
    ? (added === 1 ? L("1 registered vendor added", "تمت إضافة مورّد معتمد")
                   : L(added + " registered vendors added", "تمت إضافة " + added + " مورّدين معتمدين"))
    : L(added + " added · " + v + " as registered vendors", "تمت إضافة " + added + " · " + v + " كمورّدين معتمدين"));
  render();
}

                          : L("Add " + n + " suppliers", "إضافة " + n + " مورّدين")));

/* Chips with their own removal, plus every group this supplier is not in yet. Writes straight to
   the row, the way the vendor flag does — a group is a label, not a form field to be committed. */
function groupEditor(id){
  var s = byId(id);
  var rest = allGroups().filter(function(g){ return s.groups.indexOf(g) === -1; });
  return (s.groups.length
      ? s.groups.map(function(g){
          return '<span class="gchip">' + esc(g)
            + '<button class="x" title="' + L("Remove from this group", "إزالة من هذه المجموعة") + '" '
            +   'onclick="dropGroup(\'' + id + '\',\'' + esc(g) + '\')">'
            +   '<span class="icon" aria-hidden="true">close</span></button></span>';
        }).join("")
      : '<span class="gchip none">' + L("no group", "بلا مجموعة") + '</span>')
    + (rest.length
      ? '<select onchange="addGroup(\'' + id + '\',this.value)">'
        + '<option value="">+ ' + L("Add to a group", "إضافة لمجموعة") + '</option>'
        + rest.map(function(g){ return '<option value="' + esc(g) + '">' + esc(g) + '</option>'; }).join("")
        + '</select>'
      : "");
}
function dropGroup(id, g){
  var s = byId(id);
  s.groups = s.groups.filter(function(n){ return n !== g; });
  document.getElementById("gedit").innerHTML = groupEditor(id);
  render();
}
function addGroup(id, g){
  if (!g) return;
  var s = byId(id);
  if (s.groups.indexOf(g) === -1) s.groups.push(g);
  document.getElementById("gedit").innerHTML = groupEditor(id);
  render();
}

function saveSupplier(id){
  var nm = document.getElementById("f_name").value.trim();
  var em = document.getElementById("f_email").value.trim();
  var ph = document.getElementById("f_phone").value.trim();
  var ct = document.getElementById("f_contact").value.trim();
  var s = id ? byId(id) : null;
  if (!s && !nm) { toast(L("A company name is required", "اسم الشركة مطلوب")); return; }
  if (!em && !ph) { toast(L("Give an email or a phone number", "أدخل بريداً أو رقم هاتف")); return; }
  if (s) {
    if (s.kind !== "platform") { s.nEn = nm; s.nAr = nm; }
    s.email = em || null; s.phone = ph || null; s.contact = ct || null;

var SHEET_HEADERS = ["Company", "Contact person", "E-mail", "Mobile", "CR number", "Payment terms", "Account manager"];
var SHEET_ROWS = [
  ["Najd Equipment Est.",  "Bandar Al-Qahtani", "sales@najd-eq.sa",  "+966 55 903 1174", "1010445521", "30 days", "Bandar"],
  ["Yanbu Plant Services", "Omar Baghdadi",     "",                  "+966 50 664 2298", "4030118872", "60 days", "Omar"],
  ["Qassim Heavy Lift",    "Saleh Al-Muhaimeed","ops@qhl.com.sa",    "+966 53 771 0925", "1128840033", "30 days", "Saleh"]
];
var sheetMap = { 0:"name", 1:"contact", 2:"email", 3:"phone", 4:"extra", 5:"extra", 6:"extra" };

function renderMap(){
  if (!document.getElementById("mapwrap")) return;

    ["name",    L("Company name", "اسم الشركة")],
    ["contact", L("Contact name", "اسم جهة الاتصال")],
    ["email",   L("Email", "البريد")],
    ["phone",   L("Phone", "الهاتف")],
    ["extra",   L("Keep as extra field", "احتفظ كحقل إضافي")],
    ["skip",    L("Ignore this column", "تجاهل العمود")]
  ];
  document.getElementById("mapwrap").innerHTML =
      '<table class="maptbl"><thead><tr><th>' + L("Your column", "عمودك") + '</th>'
    + '<th>' + L("Sample", "مثال") + '</th><th>' + L("Becomes", "يصبح") + '</th></tr></thead><tbody>'
    + SHEET_HEADERS.map(function(h, i){
        return '<tr><td><b>' + esc(h) + '</b></td>'

          + fields.map(function(f){
              return '<option value="' + f[0] + '"' + (sheetMap[i] === f[0] ? " selected" : "") + '>' + f[1] + '</option>';
            }).join("")

      }).join("")
    + '</tbody></table>';

function renderPreview(){
  var cols = [];
  SHEET_HEADERS.forEach(function(h, i){ if (sheetMap[i] !== "skip") cols.push(i); });
  document.getElementById("prevwrap").innerHTML =
      '<div class="prev"><table><thead><tr>'
    + '<th>' + L("Vendor", "معتمد") + '</th>'
    + cols.map(function(i){ return '<th>' + esc(SHEET_HEADERS[i]) + '</th>'; }).join("")
    + '</tr></thead><tbody>'
    + SHEET_ROWS.map(function(r, n){
        return '<tr>'
          + '<td><label class="vtick' + (sheetV[n] ? " on" : "") + '">'
          +   '<input type="checkbox" ' + (sheetV[n] ? "checked" : "")
          +     ' onchange="sheetV[' + n + ']=this.checked;renderPreview()" />'
          +   L("Registered", "معتمد") + '</label></td>'
          + cols.map(function(i){
              var v = r[i];
              return '<td>' + (v ? esc(v) : '<span class="none">' + L("empty", "فارغ") + '</span>') + '</td>';
            }).join("") + '</tr>';
      }).join("")
    + '</tbody></table></div>';
}
function setAllSheetVendors(on){
  sheetV = SHEET_ROWS.map(function(){ return on; });
  renderPreview();
}
function saveSheet(){
  var idx = {}, extras = [];
  SHEET_HEADERS.forEach(function(h, i){
    if (sheetMap[i] === "extra") extras.push(i);
    else if (sheetMap[i] !== "skip") idx[sheetMap[i]] = i;
  });
  SHEET_ROWS.forEach(function(r, n){
    var extra = {};
    extras.forEach(function(i){ if (r[i]) extra[SHEET_HEADERS[i]] = r[i]; });
    SUPPLIERS.push({ id:"s" + (SUPPLIERS.length + 1 + n), kind:"own", supplierId:null, store:false,
      nEn:r[idx.name], nAr:r[idx.name], contact:idx.contact != null ? r[idx.contact] : null,
      email:(idx.email != null && r[idx.email]) ? r[idx.email] : null,
      phone:idx.phone != null ? r[idx.phone] : null,
      vendor:sheetV[n] !== false, groups:[], source:"sheet", extra:extra,
      rooms:0, awards:0, bids:[], sent:[] });
  });
  closeModal();
  var v = sheetV.filter(Boolean).length;
  toast(v === SHEET_ROWS.length
    ? L(SHEET_ROWS.length + " imported as registered vendors", "تم استيراد " + SHEET_ROWS.length + " كمورّدين معتمدين")
    : L(SHEET_ROWS.length + " imported · " + v + " as registered vendors",
        "تم استيراد " + SHEET_ROWS.length + " · " + v + " كمورّدين معتمدين"));
  render();
}

/* ── groups ─────────────────────────────────────────────────────────────────
   Flat labels. The dropdown in the toolbar filters by one; this sheet creates and deletes them. */
/* The groups menu. Each row filters by its group, renames it, or deletes it; the last row starts a
   new one. A backdrop sits behind it so a click anywhere else closes it. */
function groupsMenu(groups){
  var label = groupFilter || L("All groups", "كل المجموعات");
  return '<span class="gwrap">'
    + (menuOpen ? '<span class="gback" onclick="menuOpen=false;render()"></span>' : "")
    + '<button class="btn btn-secondary btn-sm gbtn" onclick="menuOpen=!menuOpen;render()">'
    +   '<span class="icon" aria-hidden="true">label</span>' + esc(label)
    +   '<span class="icon caret" aria-hidden="true">' + (menuOpen ? "expand_less" : "expand_more") + '</span></button>'
    + (menuOpen
      ? '<span class="gmenu">'
        + '<span class="grow" aria-current="' + (groupFilter === "") + '">'
        +   '<button class="nm" onclick="pickGroup(\'\')">' + L("All groups", "كل المجموعات")
        +     '<span class="n">' + SUPPLIERS.length + '</span></button></span>'
        + groups.map(function(g){
            var c = SUPPLIERS.filter(function(x){ return x.groups.indexOf(g) !== -1; }).length;
            return '<span class="grow" aria-current="' + (groupFilter === g) + '">'
              + '<button class="nm" onclick="pickGroup(\'' + esc(g) + '\')">' + esc(g)
              +   '<span class="n">' + c + '</span></button>'

              +   '<span class="icon" aria-hidden="true">edit</span></button>'
              + '<button class="ic del" title="' + L("Delete the group", "حذف المجموعة") + '" onclick="dlgDeleteGroup(\'' + esc(g) + '\')">'
              +   '<span class="icon" aria-hidden="true">delete</span></button></span>';
          }).join("")
        + '<button class="new" onclick="startGroupPick()">'
        +   '<span class="icon" aria-hidden="true">add</span>' + L("New group", "مجموعة جديدة") + '</button>'
        + '</span>'
      : "")
    + '</span>';
}
function pickGroup(g){ groupFilter = g; menuOpen = false; render(); }

/* Making a group is pick-then-name: the checkbox column appears, the renter ticks who belongs, and
   only then does the group get a name. Nothing is created from an empty selection. */
function startGroupPick(){
  selectMode = true; menuOpen = false; picked = {};
  render();
}
function cancelGroupPick(){ selectMode = false; picked = {}; render(); }

function dlgRenameGroup(g){
  menuOpen = false;
  openModal('<div class="modal">'
    + mhead("edit", L("Rename the group", "إعادة تسمية المجموعة"), esc(g))
    + '<div class="mbody"><div class="field"><label>' + L("Group name", "اسم المجموعة") + '</label>'
    +   '<input id="grename" value="' + esc(g) + '" /></div></div>'

    + '</div></div>');

function saveRename(g){
  var v = document.getElementById("grename").value.trim();
  if (!v) { toast(L("Name the group", "سمِّ المجموعة")); return; }
  SUPPLIERS.forEach(function(x){
    x.groups = x.groups.map(function(n){ return n === g ? v : n; })
                       .filter(function(n, i, a){ return a.indexOf(n) === i; });
  });
  if (groupFilter === g) groupFilter = v;
  closeModal(); toast(L("Renamed to " + v, "أُعيدت التسمية إلى " + v)); render();
}

/* Deleting a group deletes the GROUP. Every supplier in it stays in the list, with one label fewer,
   and the dialog says so before the red button is pressed. */
function dlgDeleteGroup(g){
  menuOpen = false;
  var n = SUPPLIERS.filter(function(x){ return x.groups.indexOf(g) !== -1; }).length;
  openModal('<div class="modal">'
    + mhead("delete", L("Delete the group", "حذف المجموعة"), esc(g))
    + '<div class="mbody"><div class="note calm"><span class="icon" aria-hidden="true">info</span><span>'

    +     L("Delete the group", "حذف المجموعة") + '</button>'

function doDeleteGroup(g){
  SUPPLIERS.forEach(function(x){ x.groups = x.groups.filter(function(n){ return n !== g; }); });

                + '<span>' + (share
                    ? (e.opened ? L("they opened the link", "فتحوا الرابط") : L("not opened yet", "لم يُفتح بعد"))
                    : (e.joined ? L("they joined", "انضمّوا") : L("not joined yet", "لم ينضمّوا بعد"))) + '</span></span>'
                + '<span class="when">' + ago(e.when) + '</span></div>';
            }).join("") + '</div>'
          : '<div class="note calm"><span class="icon" aria-hidden="true">outgoing_mail</span><span>'
            + L("Nothing sent yet.", "لم تُرسل شيئاً بعد.") + '</span></div>')
    +   '</div>'

    +   '<div class="grid2">'
    +     '<div class="field"><label>' + L("Contact", "الاتصال") + '</label>'
    +       '<div class="note calm"><span class="icon" aria-hidden="true">contact_mail</span><span>'
    +         (hasEmail(s) ? esc(s.email)
                          : '<b>' + L("No email — the request's share sheet will skip them", "بدون بريد — ستتخطاه شاشة مشاركة الطلب") + '</b>')
    +         '<br /><span class="num ltr">' + esc(s.phone || "—") + '</span></span></div></div>'
    +     '<div class="field"><label>' + L("Groups", "المجموعات") + '</label>'
    +       '<div class="gchips">'
    +         (s.groups.length
              ? s.groups.map(function(g){ return '<span class="gchip">' + esc(g) + '</span>'; }).join("")
              : '<span class="gchip none">' + L("none", "لا شيء") + '</span>') + '</div></div>'
    +   '</div>'

    +   (s.extra ? '<div class="field"><label>' + L("From your sheet", "من ملفك") + '</label><div class="xtra">'
        + Object.keys(s.extra).map(function(k){
            return '<span class="x"><span class="k">' + esc(k) + '</span><span>' + esc(s.extra[k]) + '</span></span>';
          }).join("") + '</div></div>' : "")
    + '</div>'
    + '<div class="mfoot">'
    +   '<button class="btn btn-ghost" onclick="dlgSupplierForm(\'' + id + '\')">'
    +     '<span class="icon" aria-hidden="true">edit</span>' + L("Edit", "تعديل") + '</button>'
    +   (off
        ? '<button class="btn btn-secondary" ' + (hasEmail(s) ? 'onclick="dlgJoinInvite(\'' + id + '\')"' : "disabled") + '>'
          + '<span class="icon" aria-hidden="true">person_add</span>'
          + L("Invite to Moedatech", "دعوة للانضمام لمويداتك") + '</button>'
        : "")
    +   '<span class="spacer"></span>'
    +   '<button class="btn btn-primary" onclick="closeModal()">' + L("Close", "إغلاق") + '</button>'
    + '</div></div>');
}

/* The grade in words, so it is never something the renter has to take on trust. */
function gradeWhy(s, t){
  if (t.key === "new")     return L("no bid yet", "لا عرض بعد");
  if (t.key === "bidding") return L("they bid, you have not awarded them", "قدّم عروضاً ولم تُرسِ عليه");
  if (t.key === "working") return L("you awarded them once", "رسّيت عليه مرة");
  return L("you awarded them " + s.awards + " times", "رسّيت عليه " + s.awards + " مرات");
}

/* ══ sharing a request ══════════════════════════════════════════════════════
   The same act as the request's own share sheet (src/components/requests/ShareForBidsSheet.tsx),
   entered from the other end: there you hold a request and pick people, here you hold people and
   pick the request. Both write the same record, so either way it lands under "What you sent them"
   and on the request itself.

   The link, its preview card and the deadline are the app's — nothing about them is decided here.
   The one rule that holds in both places: no email address, no send, and the skipped are named
   before the send, not after. */
var REQUESTS = [
  { id:"r1", eqEn:"Excavator 20t",     eqAr:"حفارة 20 طن",   units:5, siteEn:"Qiddiya — Zone 4",  siteAr:"القدية — المنطقة 4",
    start:"2026-09-01", end:"2026-12-31", closes:"2026-09-04" },
  { id:"r2", eqEn:"Manlift 16m",       eqAr:"رافعة أفراد 16م", units:4, siteEn:"Diriyah Gate",     siteAr:"بوابة الدرعية",
    start:"2026-09-15", end:"2026-11-30", closes:"2026-09-02" },
  { id:"r3", eqEn:"Generator 250 kVA", eqAr:"مولد 250 ك.ف.أ", units:2, siteEn:"Aramco — Dhahran", siteAr:"أرامكو — الظهران",
    start:"2026-09-10", end:"2027-03-10", closes:"2026-09-06" }
];
function reqOf(id){ for (var i=0;i<REQUESTS.length;i++) if (REQUESTS[i].id===id) return REQUESTS[i]; return null; }
function fmtDate(iso){
  var d = new Date(iso);
  var m   = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()];
  var mAr = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"][d.getMonth()];
  return d.getDate() + " " + L(m, mAr) + " " + d.getFullYear();
}

var shSel = {}, shReq = "r1", shNote = "";

/* From one row. */
function shareOne(id){ shSel = {}; shSel[id] = true; dlgShare(true); }

function dlgShare(keep){
  if (!keep) { shSel = {}; SUPPLIERS.forEach(function(x){ if (x.vendor && hasEmail(x)) shSel[x.id] = true; }); }
  shNote = "";
  openModal('<div class="modal wide">'
    + mhead("share", L("Share a request for bids", "مشاركة طلب لتلقّي العروض"),
            L("Pick a group or the individuals, then the request. Sent by Moedatech, with you as the reply-to.",
              "اختر مجموعة أو أفراداً، ثم الطلب. يُرسل من مويداتك، والردود تصلك أنت."))
    + '<div class="mbody" id="shbody"></div>'
    + '<div class="mfoot"><span class="note" id="shcount"></span><span class="spacer"></span>'
    +   '<button class="btn btn-ghost" onclick="closeModal()">' + L("Cancel", "إلغاء") + '</button>'
    +   '<button class="btn btn-primary" id="shsend" onclick="sendShare()">'
    +     '<span class="icon" aria-hidden="true">send</span><span id="shsendtxt"></span></button>'
    + '</div></div>');
  renderShare();
}

function renderShare(){
  var r = reqOf(shReq);
  var chosen   = SUPPLIERS.filter(function(x){ return shSel[x.id]; });
  var sendable = chosen.filter(hasEmail);
  var skipped  = chosen.filter(function(x){ return !hasEmail(x); });
  var groups = allGroups();

  document.getElementById("shbody").innerHTML =
      '<div class="field"><label>' + L("Who gets it", "من يصله") + '</label>'
    +   '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">'
    +     '<button class="fchip" onclick="shAllVendors()">'
    +       '<span class="icon" aria-hidden="true">verified</span>'
    +       L("All registered vendors", "كل المورّدين المعتمدين") + '</button>'
    +     groups.map(function(g){
            var c = SUPPLIERS.filter(function(x){ return x.groups.indexOf(g) !== -1; }).length;
            return '<button class="fchip" onclick="shGroup(\'' + esc(g) + '\')">'
              + '<span class="icon" aria-hidden="true">label</span>' + esc(g)
              + ' <span class="n">' + c + '</span></button>';
          }).join("")
    +     '<button class="fchip" onclick="shSel={};renderShare()">' + L("None", "لا أحد") + '</button>'
    +   '</div>'
    +   '<div class="plist">' + SUPPLIERS.map(function(x){
          return '<label class="prow"><input type="checkbox" ' + (shSel[x.id] ? "checked" : "")
            + ' onchange="shSel[\'' + x.id + '\']=this.checked;renderShare()" />'
            + '<span class="t"><b>' + esc(name(x)) + '</b><span>'
            + (hasEmail(x) ? esc(x.email) : L("no email", "بدون بريد"))
            + (x.groups.length ? " · " + esc(x.groups.join(" · ")) : "") + '</span></span>'
            + (hasEmail(x) ? "" : '<button class="btn btn-secondary btn-sm" onclick="event.preventDefault();dlgAddEmail(\''
                + x.id + '\')">' + L("Add email", "أضف بريداً") + '</button>')
            + '</label>';
        }).join("") + '</div></div>'

    + (skipped.length
      ? '<div class="note warn"><span class="icon" aria-hidden="true">error</span><span><b>'
        + skipped.length + " " + L("will be skipped — no email address", "سيتم تخطّيهم — بلا بريد") + '</b><br />'
        + esc(skipped.map(name).join(", ")) + '</span></div>'
      : "")

    + '<div class="field"><label>' + L("Which request", "أي طلب") + '</label>'
    +   '<select onchange="shReq=this.value;renderShare()">'
    +     REQUESTS.map(function(x){
            return '<option value="' + x.id + '"' + (shReq === x.id ? " selected" : "") + '>'
              + esc(L(x.eqEn, x.eqAr)) + " ×" + x.units + " — " + esc(L(x.siteEn, x.siteAr)) + '</option>';
          }).join("")
    +   '</select></div>'

    + '<div class="field"><label>' + L("A line of your own", "سطر منك") + '</label>'
    +   '<textarea rows="2" oninput="shNote=this.value" placeholder="'
    +     L("Optional — added above the request details.", "اختياري — يُضاف فوق تفاصيل الطلب.") + '">'
    +   esc(shNote) + '</textarea></div>'

    + '<div class="field"><label>' + L("What they receive", "ما سيصلهم") + '</label>' + shareMail(r, sendable) + '</div>';

  document.getElementById("shcount").innerHTML = sendable.length
    ? sendable.length + " " + L("recipients", "مستلم")
      + (skipped.length ? ' · <span style="color:var(--danger-deep);font-weight:800">' + skipped.length + " "
          + L("skipped", "متخطّى") + '</span>' : "")
    : L("Pick at least one supplier with an email", "اختر مورّداً واحداً لديه بريد");
  document.getElementById("shsendtxt").textContent = sendable.length
    ? L("Send to " + sendable.length, "إرسال إلى " + sendable.length)
    : L("Send", "إرسال");
  document.getElementById("shsend").disabled = sendable.length === 0;
}
function shAllVendors(){
  shSel = {};
  SUPPLIERS.forEach(function(x){ if (x.vendor) shSel[x.id] = true; });
  renderShare();
}
function shGroup(g){
  shSel = {};
  SUPPLIERS.forEach(function(x){ if (x.groups.indexOf(g) !== -1) shSel[x.id] = true; });
  renderShare();
}

/* The message. Everything in it is the app's own — the link, and the card the link unfurls into
   (built by src/app/bid/[token]/page.tsx and rendered by that route's `og`). */
function shareMail(r, sendable){
  var co = L(RENTER.coEn, RENTER.coAr);
  var to = !sendable.length ? "—"
    : (sendable.length <= 2
        ? sendable.map(function(x){ return x.email; }).join(", ")
        : sendable[0].email + " " + L("and " + (sendable.length - 1) + " more", "و" + (sendable.length - 1) + " آخرين"));
  return '<div class="mail">'
    + '<div class="mailhead">'
    +   '<div class="l"><span class="k">' + L("From", "من") + '</span><span class="v">Moedatech &lt;rfq@moedatech.net&gt;</span></div>'
    +   '<div class="l"><span class="k">' + L("Reply to", "الرد إلى") + '</span><span class="v">' + esc(RENTER.email) + '</span></div>'
    +   '<div class="l"><span class="k">' + L("To", "إلى") + '</span><span class="v">' + esc(to) + '</span></div>'
    +   '<div class="l"><span class="k">' + L("Subject", "الموضوع") + '</span><span class="v">'
    +     esc(L(co + " invites you to bid — " + r.eqEn + ", " + r.siteEn,
                co + " يدعوك لتقديم عرض — " + r.eqAr + "، " + r.siteAr)) + '</span></div>'
    + '</div>'
    + '<div class="mailbody">'
    +   '<div>' + L("Hello,", "مرحباً،") + '</div>'
    +   (shNote ? '<div>' + esc(shNote) + '</div>' : "")
    +   '<div>' + L(co + " is asking for a quotation on the request below. Open the link, fill in your price and terms, and submit — no account needed.",
                    co + " يطلب عرض سعر على الطلب أدناه. افتح الرابط وأدخل السعر والشروط وأرسل — بدون حساب.") + '</div>'
    +   '<div class="lcard">'
    +     '<div class="top"><span class="plate"><span class="icon" aria-hidden="true">handyman</span></span>'
    +       '<span><b>' + esc(L(r.eqEn, r.eqAr)) + " ×" + r.units + '</b>'
    +       '<span>' + L("Request for quotation · Moedatech", "طلب عرض سعر · مويداتك") + '</span></span></div>'
    +     '<div class="rows">'
    +       '<span class="r"><span class="k">' + L("Site", "الموقع") + '</span><span class="v">'
    +         esc(L(r.siteEn, r.siteAr)) + '</span></span>'
    +       '<span class="r"><span class="k">' + L("Rental period", "فترة الإيجار") + '</span><span class="v num ltr">'
    +         fmtDate(r.start) + " → " + fmtDate(r.end) + '</span></span>'
    +       '<span class="r"><span class="k">' + L("Units", "العدد") + '</span><span class="v num">' + r.units + '</span></span>'
    +       '<span class="r"><span class="k">' + L("Requested by", "الطالب") + '</span><span class="v">'
    +         esc(co) + '</span></span>'
    +     '</div>'
    +     '<div class="foot">web.moedatech.net/bid/…</div></div>'
    +   '<div><span class="cta">' + L("Submit your bid", "قدّم عرضك") + '</span></div>'
    +   '<div style="color:var(--muted)">' + L("Bidding closes " + fmtDate(r.closes) + ".",
                                               "يغلق استقبال العروض في " + fmtDate(r.closes) + ".") + '</div>'
    + '</div></div>';
}

function sendShare(){
  var chosen   = SUPPLIERS.filter(function(x){ return shSel[x.id]; });
  var sendable = chosen.filter(hasEmail);
  var skipped  = chosen.filter(function(x){ return !hasEmail(x); });
  var r = reqOf(shReq);
  /* Recorded per recipient — the same record the request's own share sheet writes. */
  sendable.forEach(function(x){
    x.sent.unshift({ kind:"share", reqEn:r.eqEn, reqAr:r.eqAr, when:"2026-08-31", opened:false });
  });
  closeModal();
  openModal('<div class="modal">'
    + mhead("mark_email_read", L("Request shared", "تمت مشاركة الطلب"),
            esc(L(r.eqEn, r.eqAr) + " — " + L(r.siteEn, r.siteAr)))
    + '<div class="mbody">'
    +   '<div class="note good"><span class="icon" aria-hidden="true">check_circle</span><span><b>'
    +     sendable.length + " " + L("emails sent", "بريد أُرسل") + '</b><br />'
    +     esc(sendable.map(name).join(", ")) + '</span></div>'
    +   (skipped.length
        ? '<div class="note warn"><span class="icon" aria-hidden="true">error</span><span><b>'
          + skipped.length + " " + L("skipped — no email", "متخطّى — بلا بريد") + '</b><br />'
          + esc(skipped.map(name).join(", ")) + '</span></div>'
        : "")
    +   '<div class="note calm"><span class="icon" aria-hidden="true">visibility</span><span>'
    +     L("Who opened it and who bid shows on the request itself.",
             "من فتحه ومن قدّم عرضاً يظهر في الطلب نفسه.") + '</span></div>'
    + '</div>'
    + '<div class="mfoot"><span class="spacer"></span>'
    +   '<button class="btn btn-primary" onclick="closeModal()">' + L("Done", "تم") + '</button>'
    + '</div></div>');
  render();
}

/* ══ email 2 — invite to Moedatech ══════════════════════════════════════════
   A different message with a different purpose: join the platform. Off-platform suppliers only —
   a supplier who already has an account has nothing to join. Same store listings the app sends
   (src/lib/config/store-links.ts). */
function dlgJoinInvite(id){
  var s = byId(id);
  var co = L(RENTER.coEn, RENTER.coAr);
  openModal('<div class="modal wide">'
    + mhead("person_add", L("Invite to Moedatech", "دعوة للانضمام لمويداتك"), esc(name(s)))
    + '<div class="mbody">'
    +   '<div class="note calm"><span class="icon" aria-hidden="true">info</span><span>'
    +     L("This is not the request link. It asks them to join Moedatech, so their bids arrive in the app instead of through a form — and they get their own store.",
             "هذه ليست رابط الطلب. إنها دعوة للانضمام لمويداتك حتى تصل عروضهم داخل التطبيق بدل النموذج — ويحصلون على متجرهم.") + '</span></div>'
    +   '<div class="mail">'
    +     '<div class="mailhead">'
    +       '<div class="l"><span class="k">' + L("From", "من") + '</span><span class="v">Moedatech &lt;hello@moedatech.net&gt;</span></div>'
    +       '<div class="l"><span class="k">' + L("To", "إلى") + '</span><span class="v">' + esc(s.email) + '</span></div>'
    +       '<div class="l"><span class="k">' + L("Subject", "الموضوع") + '</span><span class="v">'
    +         esc(L(co + " invites you to join Moedatech", co + " يدعوك للانضمام إلى مويداتك")) + '</span></div>'
    +     '</div>'
    +     '<div class="mailbody">'
    +       '<div>' + esc(L("Hello " + (s.contact || name(s)) + ",", "مرحباً " + (s.contact || name(s)) + "،")) + '</div>'
    +       '<div>' + L(co + " already works with you and uses Moedatech to run its equipment rentals. Join and their requests reach you in the app, with your own store, your fleet and your documents in one place.",
                        co + " يتعامل معك بالفعل ويستخدم مويداتك لإدارة تأجير المعدات. انضم لتصلك طلباتهم داخل التطبيق، مع متجرك وأسطولك ومستنداتك في مكان واحد.") + '</div>'
    +       '<div class="stores">'
    +         '<span class="sbadge"><span class="icon" aria-hidden="true">ios_share</span>'
    +           '<span><i>' + L("Download on the", "حمّله من") + '</i><b>App Store</b></span></span>'
    +         '<span class="sbadge"><span class="icon" aria-hidden="true">play_arrow</span>'
    +           '<span><i>' + L("Get it on", "احصل عليه من") + '</i><b>Google Play</b></span></span>'
    +       '</div>'
    +       '<div style="color:var(--muted)">' + L("Signing up is free.", "التسجيل مجاني.") + '</div>'
    +     '</div></div>'
    + '</div>'
    + '<div class="mfoot"><span class="spacer"></span>'
    +   '<button class="btn btn-ghost" onclick="closeModal()">' + L("Cancel", "إلغاء") + '</button>'
    +   '<button class="btn btn-primary" onclick="sendJoinInvite(\'' + id + '\')">'
    +     '<span class="icon" aria-hidden="true">send</span>' + L("Send the invitation", "إرسال الدعوة") + '</button>'
    + '</div></div>');
}
function sendJoinInvite(id){
  var s = byId(id);
  s.sent.unshift({ kind:"join", when:"2026-08-31", joined:false });
  closeModal();
  toast(L("Invitation sent to " + name(s), "أُرسلت الدعوة إلى " + name(s)));
  render();
}

document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeModal(); });
render();
</script>
