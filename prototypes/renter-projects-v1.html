<!--
  Moedatech — RENTER PROJECTS · v1
  Spec: docs/specs/007-renter-projects.md   Plan: docs/implementation-plans/renter-projects/plan.md

  Structure borrowed from renter-dashboard-v2.html (rail + meta bar + gantt). The behaviour is the
  agreed model, which differs from that prototype in five ways:

    1. THREE LEVELS.  Project (location + when, location locked for everything below)
                      → work order (the renter's own record, never reaches the marketplace)
                      → request (the marketplace RFQ).

    2. NO STATES.     The Fulfilled/Awarded/Contracted/On-rent/Ended ramp is gone. A bar is just
                      start → end. Two renter-set pins sit on it: mobilized (green), demobilized
                      (orange). No legend — a green dot and an orange dot do not need a caption.

    3. THE ROW IS AN AWARD, NOT AN ITEM.  An award splits units across suppliers, so 3 excavators
                      can be 2 from one vendor and 1 from another — two rows, two bars, two sets
                      of pins and papers. An un-awarded item is one hatched row.

    4. AWARD IS PRIVATE.  Not the marketplace accept. Reads nothing from the deal room, writes
                      nothing to it. One gate: the supplier must be vendor-registered.

    5. NOTHING PROPAGATES DOWNWARD except on the renter's explicit tick in the project-defaults
                      dialog, and then only through the request's own edit rules.

  TODAY is pinned to 2026-10-12 so the chart shows a project mid-flight. Demo data throughout.
-->

<style>
  :root{
    --navy-deep:#16263f; --navy:#1c3550; --navy-mid:#2a4f72;
    --muted-dark:#5a6b82; --muted:#6b8fa8; --muted-light:#9aa7b8;
    --border-strong:#c3d2e0; --border:#d4e0ec;
    --surface3:#e4edf5; --surface2:#eff4f9; --background:#f5f8fc; --surface:#ffffff;
    --brand:#f79009; --brand-hover:#e58108; --brand-press:#cc7207;
    --brand-deep:#b45309; --brand-pale:#fde8cc; --brand-soft:#fff4e5;
    --ok:#1daf58; --ok-soft:#e7f7ee; --ok-deep:#15803d;
    --warn:#d4780a; --warn-soft:#fff3e0; --warn-deep:#8a4f08;
    --danger:#d9362a; --danger-soft:#fcebea; --danger-deep:#b03636;
    --info:#1a7ec8; --info-soft:#e6f2fb; --info-deep:#0e4f7e;
    --t-label:11px; --t-meta:12.5px; --t-body:13px; --t-subhead:15px; --t-title:17px; --t-display:22px;
    --r-sm:2px; --r-md:4px; --r-lg:6px; --r-full:999px;
    --c-sm:30px; --c-md:34px; --c-lg:44px;
    --t:150ms cubic-bezier(.32,.72,.24,1);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--background);color:var(--navy);
    font-family:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:var(--t-body);line-height:1.5;-webkit-font-smoothing:antialiased}
  [dir="rtl"] body{font-family:"IBM Plex Sans Arabic","Nunito",sans-serif}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input,select,textarea{font:inherit;color:inherit}
  a{color:inherit;text-decoration:none}
  h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:800;letter-spacing:-.02em}
  p{margin:0}
  ::selection{background:var(--brand-pale);color:var(--navy)}
  .icon{font-family:"Material Symbols Rounded";line-height:1;display:inline-block;direction:ltr;
    -webkit-font-feature-settings:"liga";user-select:none;font-variation-settings:"opsz" 24,"wght" 400,"FILL" 0}
  .num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){ *,*::before,*::after{transition:none !important} }

  .wrap{max-width:1560px;margin:0 auto;padding:0 16px}
  @media (min-width:640px){ .wrap{padding:0 24px} }
  @media (min-width:1280px){ .wrap{padding:0 32px} }

  /* ── app bar ────────────────────────────────────────────────────────────── */
  .appbar{position:sticky;top:0;z-index:40;height:62px;background:var(--navy);color:#fff;
    display:flex;align-items:center;padding:0 24px;gap:18px}
  .wordmark{display:flex;align-items:center;gap:8px;font-weight:800;font-size:var(--t-title)}
  .wordmark .m{width:var(--c-sm);height:var(--c-sm);border-radius:var(--r-sm);background:#fff;color:var(--navy);
    display:grid;place-items:center;font-size:var(--t-title)}
  .navslot ul{display:flex;gap:4px;list-style:none;margin:0;padding:0}
  .navtab{display:inline-flex;align-items:center;height:var(--c-md);border-radius:var(--r-full);padding:0 16px;
    font-size:var(--t-body);font-weight:600;color:rgba(255,255,255,.72);transition:background var(--t),color var(--t)}
  .navtab:hover{background:rgba(255,255,255,.1);color:#fff}
  .navtab[aria-current="page"]{background:#fff;color:var(--navy);font-weight:800}
  .barright{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
  .langbtn{height:var(--c-sm);border-radius:var(--r-full);padding:0 12px;font-size:var(--t-meta);font-weight:800;
    border:1px solid rgba(255,255,255,.35);color:#fff;transition:background var(--t)}
  .langbtn:hover{background:rgba(255,255,255,.12)}

  /* ── section scaffolding ────────────────────────────────────────────────── */
  .sec{padding:20px 0 40px}
  .shead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .shead .plate{width:38px;height:38px;flex:none;background:var(--navy);color:#fff;
    display:grid;place-items:center;border-radius:var(--r-sm)}
  .shead .plate .icon{font-size:var(--t-display)}
  .shead h2{font-size:var(--t-title)}
  .shead .sum{display:block;color:var(--muted);font-size:var(--t-meta);margin-top:2px}
  .shead .sum b{color:var(--navy);font-weight:800}
  .shead .spacer{flex:1}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--c-md);
    border-radius:var(--r-md);padding:0 14px;font-size:var(--t-body);font-weight:700;
    transition:background var(--t),border-color var(--t),color var(--t)}
  .btn .icon{font-size:var(--t-subhead)}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand-hover)}
  .btn-secondary{background:var(--surface);border:1px solid var(--border-strong);color:var(--navy)}
  .btn-secondary:hover{background:var(--surface2);border-color:var(--navy-mid)}
  .btn-ghost{color:var(--navy);border:1px solid transparent}
  .btn-ghost:hover{background:var(--surface2)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-danger:hover{background:var(--danger-deep)}
  .btn-sm{height:var(--c-sm);padding:0 11px;font-size:var(--t-meta)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}

  /* ── projects ───────────────────────────────────────────────────────────── */
  .plane{display:grid;grid-template-columns:264px minmax(0,1fr);gap:12px;align-items:start}
  @media (max-width:980px){ .plane{grid-template-columns:1fr} }
  .prail{display:grid;gap:6px}
  .pcard{text-align:start;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
    border-inline-start:3px solid var(--border-strong);padding:10px 12px;transition:background var(--t),border-color var(--t)}
  .pcard:hover{background:var(--surface2);border-color:var(--border-strong)}
  .pcard[aria-current="true"]{border-color:var(--navy);border-inline-start-color:var(--brand);background:var(--surface2)}
  .pcard.unfiled{border-inline-start-style:dashed}
  .pcard .n{display:flex;align-items:center;gap:6px;font-size:var(--t-body);font-weight:800}
  .pcard .m{display:block;color:var(--muted);font-size:var(--t-meta);margin-top:2px}
  .pcard .arch{font-size:var(--t-label);font-weight:800;text-transform:uppercase;letter-spacing:.04em;
    color:var(--muted-light);border:1px solid var(--border);border-radius:var(--r-full);padding:0 6px}
  .railadd{border:1px dashed var(--border-strong);border-radius:var(--r-md);padding:10px 12px;color:var(--muted-dark);
    font-weight:700;font-size:var(--t-meta);text-align:start;display:flex;align-items:center;gap:7px;transition:var(--t)}
  .railadd:hover{background:var(--surface2);color:var(--navy);border-color:var(--navy-mid)}
  .railadd .icon{font-size:var(--t-subhead)}
  .railfoot{display:flex;justify-content:center;padding-top:2px}
  .railfoot button{font-size:var(--t-meta);font-weight:700;color:var(--muted);padding:6px}
  .railfoot button:hover{color:var(--navy)}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
  /* Unassigned draws no chart, so nothing needs clipping — and clipping was cutting the row menu. */
  .panel.loose{overflow:visible}
  .pmeta{display:flex;flex-wrap:wrap;align-items:stretch;border-bottom:1px solid var(--border)}
  .pmeta .cell{flex:none;padding:10px 14px;border-inline-end:1px solid var(--border);min-width:118px}
  .pmeta .wide{min-width:210px;max-width:330px}
  .pmeta .k{font-size:var(--t-label);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .pmeta .v{font-size:var(--t-body);font-weight:800;margin-top:2px;display:flex;align-items:center;gap:6px}
  .pmeta .lock{font-size:11px;color:var(--muted-light)}
  .pmeta .addr{display:flex;align-items:center;gap:5px;max-width:300px;margin-top:3px;
    color:var(--info-deep);font-size:var(--t-body);font-weight:700}
  .pmeta .addr .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pmeta .addr .icon{font-size:var(--t-body);flex:none}
  .pmeta .auto{font-size:var(--t-label);font-weight:600;color:var(--muted-light)}
  .pmeta .spacer{flex:1;border:0;min-width:0;padding:0}
  .pmeta .go{flex:none;padding:8px 12px;display:flex;align-items:center;gap:8px;border-inline-start:1px solid var(--border)}
  .pmeta .go .btn{white-space:nowrap}

  .gantt{overflow-x:auto}
  .gmin{min-width:880px}
  .grow{display:flex;border-bottom:1px solid var(--border)}
  .grow:last-child{border-bottom:0}
  .gcol{width:300px;flex:none;padding:9px 14px 9px 34px;border-inline-end:1px solid var(--border);position:relative}
  .gcol .n{font-size:var(--t-body);font-weight:800}
  .gcol .m{color:var(--muted);font-size:var(--t-meta);margin-top:2px}
  .gcol .m b{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--navy)}
  .gtrack{flex:1;position:relative;min-height:50px}
  .greq{display:flex;background:var(--surface2);border-bottom:1px solid var(--border)}
  .greq .gcol{display:flex;align-items:center;gap:8px;padding:6px 14px;flex-wrap:wrap}
  .greq .gtrack{min-height:0;display:flex;align-items:center;padding:0 12px}
  .greq .ref{font-family:"IBM Plex Mono",monospace;font-size:var(--t-meta);font-weight:600;
    text-decoration:underline;text-underline-offset:3px}
  .greq .open{display:inline-flex;align-items:center;gap:5px;color:var(--navy)}
  .greq .open:hover{color:var(--brand-deep)}
  .greq .open .icon{font-size:var(--t-body);color:var(--muted)}
  .kind{display:inline-flex;align-items:center;gap:4px;border-radius:var(--r-full);padding:1px 8px;
    font-size:var(--t-label);font-weight:800}
  .kind.wo{background:var(--surface3);color:var(--navy-mid)}
  .kind.rfq{background:var(--info-soft);color:var(--info-deep)}
  .greq .ttl{font-size:var(--t-meta);font-weight:700;color:var(--muted-dark)}
  .ghead .gcol{padding:7px 14px;font-size:var(--t-label);font-weight:800;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted)}
  .ghead .gtrack{min-height:30px}
  .gmonth{position:absolute;top:0;bottom:0;border-inline-start:1px solid var(--border);padding:7px 0 0 8px;
    white-space:nowrap;font-size:var(--t-label);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  [dir="rtl"] .gmonth{padding:7px 8px 0 0}
  .gtoday{position:absolute;top:0;bottom:0;width:0;border-inline-start:2px dashed var(--brand);z-index:2}
  .gtoday span{position:absolute;top:4px;transform:translateX(-50%);background:var(--brand);color:#fff;
    font-size:10px;font-weight:800;border-radius:var(--r-full);padding:2px 7px;white-space:nowrap}
  [dir="rtl"] .gtoday span{transform:translateX(50%)}

  /* The bar carries no state — only the span. */
  .bar{position:absolute;top:50%;transform:translateY(-50%);height:22px;border-radius:var(--r-sm);
    display:flex;align-items:center;padding:0 8px;font-size:var(--t-label);font-weight:800;
    white-space:nowrap;overflow:hidden}
  .bar.awarded{background:var(--navy);color:#fff}
  .bar.open{background:repeating-linear-gradient(135deg,var(--surface2),var(--surface2) 6px,var(--surface3) 6px,var(--surface3) 12px);
    color:var(--muted-dark);border:1px dashed var(--border-strong)}
  /* Pins: solid green for mobilized, solid orange for demobilized. No caption — two
     coloured marks on a date line do not need a legend to be read. */
  .pin{position:absolute;top:calc(50% - 11px);width:12px;height:12px;
    transform:translate(-50%,-50%) rotate(45deg);
    background:var(--ok);border:2px solid #fff;box-shadow:0 0 0 1px var(--ok);z-index:4;cursor:default}
  [dir="rtl"] .pin{transform:translate(50%,-50%) rotate(45deg)}
  .pin.out{background:var(--brand);box-shadow:0 0 0 1px var(--brand)}

  /* Papers ride the row's top corner, not a line of their own. */
  .docpins{position:absolute;top:7px;inset-inline-end:9px;display:flex;gap:3px;z-index:2}
  .docpin{width:19px;height:19px;border-radius:var(--r-sm);display:grid;place-items:center;
    background:var(--brand-soft);border:1px solid var(--brand-pale);color:var(--brand-deep)}
  .docpin .icon{font-size:12px}
  .docpin.more{width:auto;padding:0 5px;font-size:10px;font-weight:800}

  .diff{display:inline-flex;align-items:center;gap:4px;border-radius:var(--r-full);padding:1px 8px;
    background:var(--warn-soft);color:var(--warn-deep);font-size:var(--t-label);font-weight:800;
    border:1px solid var(--brand-pale)}
  .diff .icon{font-size:12px}
  .diff:hover{background:var(--brand-soft)}

  /* row menu */
  .gmenu{position:absolute;inset-inline-start:6px;top:9px}
  .dots{width:24px;height:24px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--muted);
    transition:background var(--t),color var(--t)}
  .dots:hover{background:var(--surface3);color:var(--navy)}
  .dots .icon{font-size:var(--t-subhead)}
  .gsheet{position:absolute;inset-inline-start:0;top:26px;z-index:30;min-width:250px;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--r-md);padding:4px;display:none;
    box-shadow:0 8px 24px rgba(28,53,80,.14)}
  .gmenu.open .gsheet{display:block}
  .gsheet button{display:flex;align-items:center;gap:9px;width:100%;height:var(--c-md);border-radius:var(--r-sm);
    padding:0 10px;font-size:var(--t-body);font-weight:600;color:var(--navy);text-align:start;transition:background var(--t)}
  .gsheet button:hover{background:var(--surface2)}
  .gsheet button .icon{font-size:var(--t-subhead);color:var(--muted)}
  .gsheet .rule{height:1px;background:var(--border);margin:4px 0}
  .gsheet .danger{color:var(--danger-deep)}
  .gsheet .danger .icon{color:var(--danger)}

  /* ── dialogs ────────────────────────────────────────────────────────────── */
  .scrim{position:fixed;inset:0;z-index:60;background:rgba(28,53,80,.45);display:none;
    align-items:flex-start;justify-content:center;padding:44px 16px;overflow-y:auto}
  .scrim.open{display:flex}
  .modal{width:100%;max-width:620px;background:var(--surface);border-radius:var(--r-lg);overflow:hidden}
  .modal.wide{max-width:820px}
  .mhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
  .mhead .plate{width:32px;height:32px;flex:none;border-radius:var(--r-sm);background:var(--brand-soft);
    color:var(--brand-deep);display:grid;place-items:center}
  .mhead h3{font-size:var(--t-subhead)}
  .mhead .sub{font-size:var(--t-meta);color:var(--muted);font-weight:600}
  .mhead .x{margin-inline-start:auto;width:var(--c-sm);height:var(--c-sm);border-radius:var(--r-sm);
    display:grid;place-items:center;color:var(--muted)}
  .mhead .x:hover{background:var(--surface2);color:var(--navy)}
  .mbody{padding:16px 18px;display:grid;gap:14px}
  .mfoot{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:12px 18px;
    border-top:1px solid var(--border);background:var(--surface2)}
  .mfoot .spacer{flex:1}

  .fset{border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px}
  .fset > legend{font-size:var(--t-label);font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);padding:0 6px}
  .frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .fld{display:block}
  .fld .lbl{display:block;font-size:var(--t-label);font-weight:800;letter-spacing:.04em;text-transform:uppercase;
    color:var(--muted);margin-bottom:3px}
  .fld input,.fld select{width:100%;height:var(--c-md);border:1px solid var(--border-strong);border-radius:var(--r-md);
    background:var(--surface);padding:0 9px;font-size:var(--t-body);font-weight:600}
  .fld input:focus,.fld select:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
  .fld select[disabled]{background:var(--surface2);color:var(--muted-light)}
  .hint{font-size:var(--t-meta);color:var(--muted)}
  .warnline,.infoline,.dangerline{display:flex;align-items:flex-start;gap:8px;border-radius:var(--r-md);
    padding:8px 10px;font-size:var(--t-meta);font-weight:700}
  .warnline{background:var(--warn-soft);color:var(--warn-deep)}
  .infoline{background:var(--info-soft);color:var(--info-deep)}
  .dangerline{background:var(--danger-soft);color:var(--danger-deep)}
  .warnline .icon,.infoline .icon,.dangerline .icon{font-size:var(--t-subhead);flex:none}

  .alloc{display:grid;grid-template-columns:minmax(0,1.6fr) 76px minmax(0,1fr) 28px;gap:8px;align-items:end}
  .alloc + .alloc{margin-top:8px}

  .optrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:620px){ .optrow{grid-template-columns:1fr} }
  .optcard{display:grid;gap:6px;text-align:start;border:1px solid var(--border-strong);
    border-radius:var(--r-md);background:var(--surface);padding:14px;transition:var(--t)}
  .optcard:hover{border-color:var(--navy-mid);background:var(--surface2)}
  .optcard .ic{width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;
    background:var(--surface3);color:var(--navy-mid)}
  .optcard .ic.brand{background:var(--brand-soft);color:var(--brand-deep)}
  .optcard .tt{font-size:var(--t-subhead);font-weight:800}
  .optcard .ds{font-size:var(--t-meta);color:var(--muted);font-weight:600;line-height:1.5}

  .mcard{border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface2);
    padding:11px 12px;margin-top:9px}
  .mcard:first-of-type{margin-top:0}
  .mhd{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .mhd b{font-size:var(--t-meta);font-weight:800}
  .mhd .spacer{flex:1}
  .tag{border-radius:var(--r-full);background:var(--surface3);color:var(--muted-dark);
    padding:1px 8px;font-size:var(--t-label);font-weight:700}
  .tag.danger{background:var(--danger-soft);color:var(--danger-deep)}
  .overpanel{margin-top:10px;padding:11px 12px;border-radius:var(--r-md);background:var(--surface);
    border:1px solid var(--brand-pale);border-inline-start:3px solid var(--brand)}
  .chipset{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
  .tchip{height:28px;border-radius:var(--r-full);padding:0 12px;border:1px solid var(--border-strong);
    background:var(--surface);font-size:var(--t-meta);font-weight:700;transition:var(--t)}
  .tchip:hover{border-color:var(--navy-mid)}
  .tchip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
  .chk{display:inline-flex;align-items:center;gap:7px;height:var(--c-md);font-size:var(--t-body);
    font-weight:600;white-space:nowrap}
  .chk input{width:16px;height:16px;accent-color:var(--brand)}

  /* the map picker — a prototype surface, not a real tile layer */
  .mapbox{position:relative;height:190px;border:1px solid var(--border-strong);border-radius:var(--r-md);
    overflow:hidden;cursor:crosshair;background:#eaf1f7}
  .mapbox .grid{position:absolute;inset:0;

   iframe has no way to size itself to its content. */
var EMBED = /[?&]embed=1/.test(location.search);
if (EMBED) document.body.classList.add("is-embed");

function postHeight(){
  if (!EMBED) return;
  var h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
  try { parent.postMessage({ type: "moedatech:projects-height", height: h }, "*"); } catch (e) { /* no parent */ }
}
if (EMBED){
  window.addEventListener("load", postHeight);
  window.addEventListener("resize", postHeight);
  /* Every render changes the height — the rail, the chart, an opened modal. */
  new MutationObserver(postHeight).observe(document.body, { childList: true, subtree: true, attributes: true });
}

    mob:null, demob:null, docs:[] },
  { id:"a6", iid:"i6", sid:"s4", units:1, rate:4400,  per:"month",
    mob:"2026-10-03", demob:null, docs:[] }
];
var seq = 100;
function nid(p){ return p + (++seq); }

/* ══ helpers ════════════════════════════════════════════════════════════════ */
function d(s){ var p = String(s).split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function money(n){ return n == null ? "—" : n.toLocaleString(ar ? "ar-EG" : "en-US"); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
  return ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" })[c]; }); }
function plural(n, en1, enN, ar1, arN){ return n === 1 ? L(en1, ar1) : L(enN, arN); }

var MO_EN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var MO_AR = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];

function proj(id){ for (var i=0;i<PROJECTS.length;i++) if (PROJECTS[i].id===id) return PROJECTS[i]; return null; }

/* A project is ENDED when the last end date under it has passed. Derived from the rows
   (falling back to the project's own end when nothing is filed) and never set by anyone —
   which is why there is no archive. A site that stops being used stops being used. */
function projectEnded(p){ return span(p).hi < TODAY; }
/* Delete is offered only on an empty project: nothing filed, nothing to lose. Anything
   with rows in it offers no delete — the renter unfiles them first, deliberately. */
function projectEmpty(p){ return groupsOf(p.id).length === 0; }
function shortSite(addr){
  var first = String(addr||"").split(",")[0].trim();
  return first.replace(/\s*\d{4,}\s*/g," ").trim() || addr;
}
function projectTitle(p){ return L(p.nEn, p.nAr) || shortSite(L(p.locEn, p.locAr)); }
function groupTitle(g){
  if (L(g.tEn, g.tAr)) return L(g.tEn, g.tAr);
  if (g.kind === "rfq") return g.ref;
  var first = itemsOf(g.id)[0];
  return first ? L(first.eqEn, first.eqAr) : g.ref;
}
/* The site a row was posted with: its own, else its project's. */
function groupPlace(g){
  if (g.loc) return g.loc;
  var p = g.pid ? proj(g.pid) : null;
  return p ? L(p.locEn, p.locAr) : null;
}
/* Projects at that same site. This is what turns "pick one of forty" into "yes, that one". */
function projectsAtPlace(place, excludeId){
  if (!place) return [];
  var key = shortSite(place).toLowerCase();
  if (key.length < 3) return [];
  return PROJECTS.filter(function(p){
    if (p.id === excludeId) return false;
    return ((p.locEn || "") + " " + (p.nEn || "")).toLowerCase().indexOf(key) >= 0;
  });
}

function groupsOf(pid){ return GROUPS.filter(function(g){ return g.pid === pid; }); }
function itemsOf(gid){ return ITEMS.filter(function(i){ return i.gid === gid; }); }
function allocsOf(iid){ return ALLOCS.filter(function(a){ return a.iid === iid; }); }
function item(iid){ for (var i=0;i<ITEMS.length;i++) if (ITEMS[i].id===iid) return ITEMS[i]; return null; }
function alloc(aid){ for (var i=0;i<ALLOCS.length;i++) if (ALLOCS[i].id===aid) return ALLOCS[i]; return null; }
function awardedUnits(iid){ return allocsOf(iid).reduce(function(n,a){ return n + a.units; }, 0); }

/* The one exception to "nothing propagates": the request's own edit rule, mirrored
   from src/lib/contract/workspace.ts:213. */
function editability(g){
  if (g.kind === "wo") return { ok:true,  cls:"free", why:L("work order — always editable","أمر عمل — قابل للتعديل دائماً") };
  if (g.status !== "OPEN" && g.status !== "ACTIVE")
    return { ok:false, cls:"no", why:L("closed — can’t change","مغلق — لا يمكن التغيير") };
  if (g.bids === 0) return { ok:true,  cls:"free", why:L("no bids — free to edit","لا عروض — التعديل حر") };
  if (!g.editUsed)  return { ok:true,  cls:"cost", why:L("has bids — uses its one post-bid edit","لديه عروض — يستهلك التعديل الوحيد بعد العروض") };
  return { ok:false, cls:"no", why:L("post-bid edit already used","استُهلك التعديل بعد العروض") };
}

/* A group whose own period differs from its project's. Shown, never resolved. */
function whenDiffers(g){
  if (!g.when || !g.pid) return null;
  var p = proj(g.pid); if (!p) return null;
  var out = [];
  if (g.when.start !== p.when.start) out.push(L("start","البداية"));
  if (g.when.end   !== p.when.end)   out.push(L("end","النهاية"));
  if (g.when.basis !== p.when.basis) out.push(L("basis","الأساس"));
  if (+g.when.hours !== +p.when.hours) out.push(L("hours/day","ساعات/يوم"));
  return out.length ? out : null;
}

/* An AWARD HAS NO PERIOD OF ITS OWN. Ruled 2026-08-30 with the move to `projects.awards`: an
   award records WHO supplies how many, and the two marks. Its bar is its parent's period, widened
   by a mark that falls outside it.

   What that gives up, stated rather than hidden: a hire renegotiated past a closed request's end
   shows the original end until the machine is demobilized. What it buys is that there are two
   levels of date instead of three, and no "which of these dates wins" question anywhere. */
function awardWindow(g, a){
  var w = g.when || proj(g.pid).when;
  var st = w.start, en = w.end;
  if (a.mob   && a.mob   < st) st = a.mob;     /* arrived before the period opened */
  if (a.demob && a.demob > en) en = a.demob;   /* still standing there after it closed */
  if (a.mob   && a.mob   > en) en = a.mob;
  return { start: st, end: en };
}

/* Every date the chart has to be able to draw: the period of any work order or request that
   carries one — including ones nobody has awarded yet, whose ghost bar still has to fit on the
   axis — and every mark, since a machine that arrived late or has not left yet must stay on the
   axis rather than being clipped off its edge. */
function projectDates(pid){
  var out = [];
  groupsOf(pid).forEach(function(g){
    if (g.when){ out.push(g.when.start); out.push(g.when.end); }
    itemsOf(g.id).forEach(function(i){
      allocsOf(i.id).forEach(function(a){
        if (a.mob) out.push(a.mob);
        if (a.demob) out.push(a.demob);
      });
    });
  });
  return out;
}
/* The axis runs from the project's own window, widened to hold the earliest start and the
   latest end anywhere under it — so a work order that runs three months past the site's end
   is visible rather than clipped off the right edge. */
function span(p){
  var ds = projectDates(p.id);
  var lo = ds.length ? ds.reduce(function(a,b){ return a<b?a:b; }) : p.when.start;
  var hi = ds.length ? ds.reduce(function(a,b){ return a>b?a:b; }) : p.when.end;
  if (p.when.start < lo) lo = p.when.start;
  if (p.when.end   > hi) hi = p.when.end;
  var from = d(lo), to = d(hi);
  from = new Date(from.getFullYear(), from.getMonth(), 1);
  to   = new Date(to.getFullYear(), to.getMonth()+1, 1);
  return { from:from, to:to, lo:lo, hi:hi };
}
function pct(dt, s){ return ((dt - s.from) / (s.to - s.from)) * 100; }

      + '</div>'
      + '<div class="cell wide"><div class="k">' + L("Location","الموقع")

      + '<div class="cell spacer"></div>'

      +   '<button class="btn btn-primary btn-sm" onclick="pickTab(\'intake\')">'
      +     '<span class="icon">add</span>' + L("New request","طلب جديد") + '</button>'

      +     (projectEmpty(p) ? L("Delete the project","احذف المشروع")

      +     '" style="padding:0 7px' + (projectEmpty(p) ? '' : ';opacity:.45') + '">'
      +     '<span class="icon" style="color:var(--danger)">delete</span></button>'
      + '</div></div>';

  document.getElementById("tab-projects").innerHTML =
      '<div class="shead">'
    +   '<span class="plate"><span class="icon">location_city</span></span>'
    +   '<span class="txt"><h2>' + L("My projects","مشاريعي") + '</h2>'
    +     '<span class="sum"><b>' + projCount + '</b> ' + L("live projects","مشاريع جارية")
    +       ' · <b>' + totalUnits + '</b> ' + L("units awarded","وحدة مُرساة") + '</span></span>'
    + '</div>'
    + '<div class="banner"><span class="icon">info</span><span>'

        "<b>نموذج أوّلي.</b> الشريط هو المدة فقط — لا حالات. الأخضر يوم التعبئة، والبرتقالي يوم المغادرة. كل صف <b>إرساء</b> واحد. ويظهر المشروع <b>منتهياً</b> بعد آخر تاريخ فيه — لا أرشفة، ولا حذف إلا وهو فارغ.")

/* Unassigned rows have no project, so no inherited dates and no chart. */

/* An item nobody has awarded: one ghost bar over the inherited dates, no marks, no
   papers. Award first — the model enforces it by having no row to hang them on. */
function openRowHtml(g, it, s, tp, tin){
  var p = proj(g.pid), w = g.when || p.when;

    +   L("awaiting award","بانتظار الإرساء") + '</span>'

/* The award row — the real unit of this chart. */
function allocRowHtml(g, it, a, s, tp, tin){
  var win = awardWindow(g, a);

/* The row menu — the actions this model has, by row type. */
function rowMenu(g, it, a){
  var key = a ? a.id : ("open-" + it.id);
  var b = [];
  if (!a){
    b.push(mi("military_tech", L("Award","إرساء"), "dlgAward('" + it.id + "')"));
    if (g.kind === "rfq") b.push(mi("gavel", L("Review the bids","راجع العروض"), ""));
    b.push(rule());
    b.push(mi("assignment", g.kind === "rfq" ? L("Open the request","افتح الطلب") : L("Edit the work order","عدّل أمر العمل"),
              g.kind === "rfq" ? "" : "dlgEditWorkOrder('" + g.id + "')"));
  } else {
    b.push(mi("attach_file", L("Attach a document","أرفق مستنداً"), "dlgAttach('" + a.id + "')"));
    b.push(mi(a.mob ? "undo" : "local_shipping",
              a.mob ? L("Undo mobilized","تراجع عن التعبئة") : L("Mark as mobilized","سجّل التعبئة"),
              "togglePin('" + a.id + "','mob')"));
    b.push(mi(a.demob ? "undo" : "flag",
              a.demob ? L("Undo demobilized","تراجع عن التفكيك") : L("Mark as demobilized","سجّل التفكيك"),
              "togglePin('" + a.id + "','demob')"));
    b.push(rule());
    b.push(mi("military_tech", L("Change the award","غيّر الإرساء"), "dlgAward('" + it.id + "')"));
    b.push(mi("undo", L("Un-award this row","ألغِ إرساء هذا الصف"), "dlgUnaward('" + a.id + "')"));
    b.push(rule());
    if (g.kind === "rfq"){
      b.push(mi("assignment", L("Open the request","افتح الطلب"), ""));
      b.push(mi("picture_as_pdf", L("Our quotation","عرض السعر الصادر منّا"), ""));
      b.push(mi("forum", L("Open the deal room","افتح غرفة الصفقة"), ""));
    } else {
      b.push(mi("edit", L("Edit the work order","عدّل أمر العمل"), "dlgEditWorkOrder('" + g.id + "')"));
    }
  }
  b.push(rule());
  b.push(mi("drive_file_move",
            g.pid ? L("Move to another project","انقل إلى مشروع آخر") : L("File in a project","أدرج في مشروع"),
            "dlgMove('" + g.id + "')"));
  if (g.pid) b.push(mi("link_off", L("Remove from the project","أزل من المشروع"), "dlgRemove('" + g.id + "')", true));
  if (g.kind === "wo") b.push(mi("delete", L("Delete the work order","احذف أمر العمل"), "dlgDeleteWo('" + g.id + "')", true));

  return '<div class="gmenu' + (openRow === key ? " open" : "") + '">'
    + '<button class="dots" type="button" aria-label="' + L("Row actions","إجراءات الصف") + '" '
    +   'onclick="event.stopPropagation();toggleRow(\'' + key + '\')"><span class="icon">more_horiz</span></button>'
    + '<div class="gsheet" onclick="event.stopPropagation()">' + b.join("") + '</div></div>';
}
function mi(icon, label, fn, danger){
  return '<button type="button"' + (danger ? ' class="danger"' : '')
    + (fn ? ' onclick="' + fn + '"' : ' onclick="closeRow()"') + '>'
    + '<span class="icon">' + icon + '</span>' + label + '</button>';
}
function rule(){ return '<div class="rule"></div>'; }

function pickProject(id){ projSel = id; openRow = null; editingTitle = null; render(); }
function toggleRow(k){ openRow = (openRow === k ? null : k); render(); }
function closeRow(){ openRow = null; render(); }
document.addEventListener("click", function(){ if (openRow !== null){ openRow = null; render(); } });

function editTitle(id){
  editingTitle = id; render();
  var f = document.getElementById("ptitle"); if (f){ f.focus(); f.select(); }
}
function saveTitle(){
  var f = document.getElementById("ptitle"), p = proj(editingTitle);
  if (f && p){
    var v = f.value.trim(), def = shortSite(L(p.locEn, p.locAr));
    var own = (v && v !== def) ? v : null;
    p.nEn = own; p.nAr = own;
  }
  editingTitle = null; render();
}
function togglePin(aid, which){
  var a = alloc(aid); if (!a) return;
  if (which === "mob")   a.mob   = a.mob   ? null : TODAY;
  if (which === "demob") a.demob = a.demob ? null : TODAY;
  openRow = null; render();
}

/* ══ dialog shell ═══════════════════════════════════════════════════════════ */
function openModal(html){ var s = document.getElementById("scrim"); s.innerHTML = html; s.classList.add("open"); }
function closeModal(){ var s = document.getElementById("scrim"); s.classList.remove("open"); s.innerHTML = ""; }
function mshell(icon, title, sub, body, foot, wide){
  return '<div class="modal' + (wide ? " wide" : "") + '" onclick="event.stopPropagation()">'
    + '<div class="mhead"><span class="plate"><span class="icon">' + icon + '</span></span>'
    +   '<span><h3>' + title + '</h3>' + (sub ? '<span class="sub">' + sub + '</span>' : '') + '</span>'
    +   '<button class="x" onclick="closeModal()"><span class="icon">close</span></button></div>'
    + '<div class="mbody">' + body + '</div>'
    + '<div class="mfoot">' + foot + '</div></div>';
}
function confirmDlg(icon, title, sub, body, confirmLabel, fn, danger){
  openModal(mshell(icon, title, sub, body,
    '<span class="spacer"></span>'
    + '<button class="btn btn-secondary" onclick="closeModal()">' + L("Cancel","إلغاء") + '</button>'
    + '<button class="btn ' + (danger ? "btn-danger" : "btn-primary") + '" onclick="' + fn + '">'
    + confirmLabel + '</button>'));
}
function sel(map, val, onchange, label){
  return '<label class="fld"><span class="lbl">' + label + '</span><select onchange="' + onchange + '">'
    + Object.keys(map).map(function(k){
        return '<option value="' + k + '"' + (String(val)===k ? " selected" : "") + '>'
          + L(map[k][0], map[k][1]) + '</option>'; }).join("")
    + '</select></label>';
}
function selId(map, val, id, label){
  return '<label class="fld"><span class="lbl">' + label + '</span><select id="' + id + '">'
    + Object.keys(map).map(function(k){
        return '<option value="' + k + '"' + (String(val)===k ? " selected" : "") + '>'
          + L(map[k][0], map[k][1]) + '</option>'; }).join("")
    + '</select></label>';
}

/* ══ the project form — one form for New and for Defaults ═══════════════════
   New and Edit are the same fields; Edit adds the propagation section, which is
   the ONLY place a project writes into what is already filed under it. */
var mapPos = { x:42, y:46, lat:24.7136, lng:46.6753 };

function mapPick(ev){
  var box = ev.currentTarget.getBoundingClientRect();
  var x = ((ev.clientX - box.left) / box.width) * 100;
  var y = ((ev.clientY - box.top) / box.height) * 100;
  mapPos.x = Math.max(2, Math.min(98, x));
  mapPos.y = Math.max(6, Math.min(98, y));
  /* a plausible Riyadh-area coordinate, so the readout moves with the pin */
  mapPos.lat = +(24.55 + (100 - mapPos.y) * 0.006).toFixed(4);
  mapPos.lng = +(46.45 + mapPos.x * 0.006).toFixed(4);
  var pin = document.getElementById("mappin"), co = document.getElementById("mapcoord");
  if (pin){ pin.style.insetInlineStart = mapPos.x + "%"; pin.style.top = mapPos.y + "%"; }
  if (co) co.textContent = mapPos.lat + ", " + mapPos.lng;
}
function mapHtml(){
  return '<div class="mapbox" onclick="mapPick(event)">'
    + '<div class="grid"></div>'
    + '<div class="blk" style="inset-inline-start:8%;top:8%;width:22%;height:34%"></div>'
    + '<div class="blk" style="inset-inline-start:52%;top:14%;width:30%;height:28%"></div>'
    + '<div class="blk" style="inset-inline-start:14%;top:70%;width:26%;height:22%"></div>'
    + '<div class="road r1"></div><div class="road r2"></div>'
    + '<span class="tip">' + L("click to drop the pin","انقر لوضع الدبوس") + '</span>'
    + '<span class="mappin" id="mappin" style="inset-inline-start:' + mapPos.x + '%;top:' + mapPos.y + '%">'
    +   '<span class="icon">location_on</span></span>'
    + '<span class="coord num" id="mapcoord">' + mapPos.lat + ", " + mapPos.lng + '</span>'
    + '</div>';
}

function saveProjectForm(id, applyToo){
  function v(x){ var e = document.getElementById(x); return e ? e.value : ""; }
  function c(x){ var e = document.getElementById(x); return !!(e && e.checked); }
  var loc = v("np_loc").trim();
  if (!loc){ var f = document.getElementById("np_loc"); if (f) f.focus(); return; }
  var ttl = v("np_title").trim() || null;
  /* No days-per-week: the create flow never asks for it (it is seeded to 6 and sent
     silently), and the project holds only what a renter is actually asked. */
  var when = { basis:v("np_basis"), start:v("np_start") || TODAY, end:v("np_end") || TODAY,
               hours:+v("np_hours")||10, extendable:c("np_ext") };
  /* Only payment terms is a project field now. The rest live on the request. */
  var prev = id ? proj(id).prefs : { method:"transfer", maint:"supplier", sla:"24h",
                                     verified:true, sublet:false, window:"72h" };
  var prefs = { pay:v("np_pay"), method:prev.method, maint:prev.maint, sla:prev.sla,
                verified:prev.verified, sublet:prev.sublet, window:prev.window };

  if (!id){
    var pid = nid("p");
    PROJECTS.push({ id:pid, nEn:ttl, nAr:ttl, locEn:loc, locAr:loc,
      lat:mapPos.lat, lng:mapPos.lng, mx:mapPos.x, my:mapPos.y,
      when:when, prefs:prefs });
    projSel = pid; render();
    /* A project on its own is empty, and "Add work order" lives on a board the renter has
       not seen yet. The choice belongs here, while they are still thinking about the site. */
    dlgProjectCreated(pid); return;
  }

  var p = proj(id);
  p.nEn = ttl; p.nAr = ttl; p.locEn = loc; p.locAr = loc;
  p.lat = mapPos.lat; p.lng = mapPos.lng; p.mx = mapPos.x; p.my = mapPos.y;
  p.when = when; p.prefs = prefs;

  /* The one downward write, and only for the rows the renter ticked. A ticked request
     with bids spends its single post-bid edit — which is what the dialog warned about. */
  if (applyToo){
    document.querySelectorAll('input[data-apply]').forEach(function(cb){
      if (!cb.checked || cb.disabled) return;
      var g = grp(cb.getAttribute("data-apply")); if (!g) return;
      g.when = null;                                   /* it now follows the project */
      if (g.kind === "rfq" && g.bids > 0) g.editUsed = true;
    });
  }
  closeModal(); render();
}

/* ══ conflicts — keep, or match the project ════════════════════════════════ */
function dlgConflict(gid){
  var g = grp(gid), p = proj(g.pid), e = editability(g);
  var rows = [
    [L("Rental basis","أساس الإيجار"), L(BASIS[g.when.basis][0],BASIS[g.when.basis][1]), L(BASIS[p.when.basis][0],BASIS[p.when.basis][1])],
    [L("Start","البداية"), g.when.start, p.when.start],
    [L("End","النهاية"), g.when.end, p.when.end],
    [L("Hours/day","ساعات/يوم"), g.when.hours, p.when.hours]
  ].filter(function(r){ return String(r[1]) !== String(r[2]); })
   .map(function(r){
     return '<div class="applyrow"><span class="nm">' + r[0] + '</span>'
       + '<span style="font-weight:800;color:var(--warn-deep)">' + r[1] + '</span>'
       + '<span class="why no">' + L("project: ","المشروع: ") + r[2] + '</span></div>';
   }).join("");

  openModal(mshell("warning", L("This differs from the project","يختلف هذا عن المشروع"),
    g.ref + " · " + esc(projectTitle(p)),
    '<div class="applylist">' + rows + '</div>'
    + '<div class="infoline"><span class="icon">check_circle</span><span>'
    +   L("Keeping it different is fine. Both values stay, and neither is overwritten.",
        "إبقاؤه مختلفاً أمر سليم. تبقى القيمتان ولا تُستبدل أيّهما.") + '</span></div>'
    + (e.ok ? '' : '<div class="warnline"><span class="icon">lock</span><span>'
        + L("It cannot be matched to the project right now: ","لا يمكن مطابقته مع المشروع الآن: ") + e.why + '</span></div>')
    + (e.cls === "cost" ? '<div class="warnline"><span class="icon">warning</span><span>'
        + L("Matching it will spend this request’s one post-bid edit.","المطابقة ستستهلك التعديل الوحيد بعد العروض.")
        + '</span></div>' : ''),
    '<span class="spacer"></span>'
    + '<button class="btn btn-secondary" onclick="closeModal()">' + L("Keep it different","أبقِه مختلفاً") + '</button>'
    + '<button class="btn btn-primary"' + (e.ok ? "" : " disabled") + ' onclick="matchProject(\'' + gid + '\')">'
    +   L("Match the project","طابِق المشروع") + '</button>'));
}
function matchProject(gid){
  var g = grp(gid);
  g.when = null;
  if (g.kind === "rfq" && g.bids > 0) g.editUsed = true;
  closeModal(); render();
}

/* ══ move · remove · delete ════════════════════════════════════════════════ */
function dlgMove(gid){
  openRow = null;
  var g = grp(gid);
  var place = groupPlace(g);
  var near = projectsAtPlace(place, g.pid);
  var rest = PROJECTS.filter(function(x){
    return x.id !== g.pid && near.indexOf(x) < 0;
  });

  /* The projects at this row's own site come first, as cards, named. Forty projects is a
     search; "the one you are obviously looking for, plus a list" is a decision. */
  var suggestion = near.length
    ? '<div class="infoline"><span class="icon">where_to_vote</span><span>'
      +   L("This was posted at ","أُرسل هذا في ") + '<b>' + esc(shortSite(place)) + '</b>'
      +   L(near.length > 1 ? ", and these projects are there." : ", and this project is there.",
            near.length > 1 ? "، وهذه المشاريع هناك." : "، وهذا المشروع هناك.")
      + '</span></div>'
      + '<div class="optrow">'
      + near.map(function(p){
          var gs = groupsOf(p.id);
          return '<button class="optcard" onclick="doMoveTo(\'' + gid + '\',\'' + p.id + '\')">'
            + '<span class="ic"><span class="icon">where_to_vote</span></span>'
            + '<span class="tt">' + esc(projectTitle(p)) + '</span>'
            + '<span class="ds">' + esc(L(p.locEn, p.locAr)) + '<br>'

function setAlloc(ix, k, v, iid){ draftAllocs[ix][k] = v; paintAward(iid); }
function addAlloc(iid){
  var it = item(iid);
  var used = draftAllocs.reduce(function(n,a){ return n + (+a.units||0); }, 0);
  draftAllocs.push({ sid:"", units:Math.max(1, it.qty - used), rate:"", start:"", end:"", id:null });
  paintAward(iid);
}
function dropAlloc(ix, iid){
  draftAllocs.splice(ix,1);
  if (!draftAllocs.length) draftAllocs = [{ sid:"", units:1, rate:"", start:"", end:"", id:null }];
  paintAward(iid);
}
function saveAward(iid){
  var it = item(iid), g = grp(it.gid), p = g.pid ? proj(g.pid) : null;
  var w = g.when || (p ? p.when : { start:TODAY, end:TODAY });
  var keep = {};
  ALLOCS.forEach(function(a){ if (a.iid === iid) keep[a.id] = a; });
  ALLOCS = ALLOCS.filter(function(a){ return a.iid !== iid; });
  draftAllocs.forEach(function(a){
    if (!a.sid) return;
    var old = a.id ? keep[a.id] : null;
    ALLOCS.push({ id:a.id || nid("a"), iid:iid, sid:a.sid, units:+a.units||1, rate:+a.rate||null, per:"month",
      mob:old ? old.mob : null, demob:old ? old.demob : null, docs:old ? old.docs : [] });
  });
  closeModal(); render();
}

/* ══ new work order ════════════════════════════════════════════════════════
   EQUIPMENT first — every field a machine line carries, plus the machine terms
   the whole order shares — then SUPPLIER & PERIOD, which picks from the renter's
   own list and may split a machine's units across more than one.

   Saving writes the work order, its items AND one allocation per supplier line,
   so a work order is awarded the moment it exists. */
var woDraft = null;
function newWoMachine(){
  return { cat:"", sub:"", size:"", custom:false, label:"", csize:"",
           qty:1, acc:"", notes:"", over:null,   /* null ⇒ follows the shared terms */
           allocs:[{ sid:"", units:1, rate:"" }] };
}
/* Switching between the catalogue and free text clears the other side, so a machine is
   never half one and half the other. */
function woToggleCustom(i){
  var m = woDraft.machines[i];
  m.custom = !m.custom;
  if (m.custom){ m.cat = ""; m.sub = ""; m.size = ""; }
  else { m.label = ""; m.csize = ""; }
  paintWo();
}
function defaultTerms(){
  return { operator:"yes", nationality:"any", natCustom:"", opCerts:[], night:false,
           fatFood:"supplier", fatAT:"supplier", safety:[], delivery:"supplier", ret:"me",
           fuelResp:"me", year:"any", fuelType:"diesel" };
}
function newWoDraft(p){
  return {
    gid:null, pid:p.id, title:"",
    machines:[ newWoMachine() ],
    terms: defaultTerms(),
    when:{ basis:p.when.basis, start:p.when.start, end:p.when.end, hours:p.when.hours, days:p.when.days },
  };
}
/* Editing loads the saved order back into the same draft shape — the same form, so there is
   one work-order form and not two. Item and allocation IDS ARE CARRIED, because the save
   upserts by id: replacing the items would give them new ids and the cascade would take
   every award, mark and document with them. */
function loadWoDraft(g){
  var p = proj(g.pid) || PROJECTS[0];
  var w = g.when || p.when;
  return {
    gid: g.id, pid: g.pid, title: (L(g.tEn, g.tAr) || ""),
    machines: itemsOf(g.id).map(function(it){
      return { id:it.id, cat:"", sub:"", size:"", custom:true, label:L(it.eqEn, it.eqAr), csize:"",
               qty:it.qty, acc:"", notes:"", over:(it.over || null),
               allocs: allocsOf(it.id).map(function(a){
                 return { id:a.id, sid:a.sid, units:a.units, rate:a.rate }; }) };
    }),
    terms: g.terms ? JSON.parse(JSON.stringify(g.terms)) : defaultTerms(),
    when: { basis:w.basis, start:w.start, end:w.end, hours:w.hours, days:w.days },
  };
}
function dlgNewWorkOrder(){ woDraft = newWoDraft(proj(projSel)); paintWo(); }
function dlgEditWorkOrder(gid){ openRow = null; woDraft = loadWoDraft(grp(gid)); paintWo(); }

/* Every award under the order, flattened — the list the period question is asked against. */
function woAwards(){
  var out = [];

        cur.sid = a.sid; cur.units = +a.units||1; cur.rate = +a.rate||null;
      } else {
        ALLOCS.push({ id:aid, iid:iid, sid:a.sid, units:+a.units||1, rate:+a.rate||null,
          per:"month", mob:null, demob:null, docs:[] });
      }
    });
  });

  if (w.gid){
    var gone = itemsOf(gid).filter(function(it){ return !keptItems[it.id]; }).map(function(it){ return it.id; });
    ITEMS  = ITEMS.filter(function(it){ return it.gid !== gid || keptItems[it.id]; });
    ALLOCS = ALLOCS.filter(function(a){
      if (gone.indexOf(a.iid) >= 0) return false;
      return keptItems[a.iid] === undefined ? true : !!keptAllocs[a.id];
    });
  }
  woDraft = null; closeModal(); render();
}

        return '<option value="' + o[0] + '"' + (String(val) === String(o[0]) ? " selected" : "") + '>'
          + o[1] + '</option>'; }).join("")

function ov(k, dflt){ return iOverrides[k] !== undefined ? iOverrides[k] : dflt; }

/* The agent reports any place it saw in the text; the WEB compares it with the

var CITIES = [["dammam","الدمام"],["riyadh","الرياض"],["jeddah","جدة"],["dhahran","الظهران"],
              ["qiddiya","القدية"],["diriyah","الدرعية"],["jubail","الجبيل"]];
function detectConflict(p){
  var hay = iText.toLowerCase(), site = (L(p.locEn,p.locAr) + " " + p.locEn).toLowerCase();
  for (var i=0;i<CITIES.length;i++){
    var c = CITIES[i];
    if ((hay.indexOf(c[0]) >= 0 || iText.indexOf(c[1]) >= 0) && site.indexOf(c[0]) < 0)
      return ar ? c[1] : c[0].charAt(0).toUpperCase() + c[0].slice(1);

}

/* Which of the three speeds this text would take. The tier follows the SHAPE OF THE
   TEXT, not whether a project exists — the project only fills the blanks afterwards. */
function tier(){
  var t = iText.trim();
  var oneLine = t.length > 0 && t.length <= 42 && t.split(/\s+/).length <= 6
             && !/[.,;]|\band\b|\bwith\b|\bو\b|\bمع\b/i.test(t);
  if (!t) return { cls:"", nm:L("Waiting","بانتظار"), why:L("nothing typed yet","لم تكتب شيئاً"), ms:"—" };
  if (oneLine) return { cls:"", nm:L("Instant match","مطابقة فورية"),
    why:L("keyword + size against the catalogue — no model runs","كلمة مفتاحية + مقاس مقابل الفهرس — بلا نموذج"), ms:"~50 ms" };
  if (iProject) return { cls:"t1", nm:L("Equipment-only agent","الوكيل — المعدّة فقط"),
    why:L("small model, equipment output only, one round trip","نموذج صغير، مخرجات المعدّة فقط، طلب واحد"), ms:"< 5 s" };
  return { cls:"t2", nm:L("Full agent","الوكيل الكامل"),
    why:L("no project — the header has to be extracted too","لا مشروع — يجب استخراج الترويسة أيضاً"), ms:"30–60 s" };
}

/* Offered AFTER a projectless submit — never before it, and never as a gate. */
function detectedPlace(){
  var hay = iText.toLowerCase();
  for (var i=0;i<CITIES.length;i++){
    if (hay.indexOf(CITIES[i][0]) >= 0 || iText.indexOf(CITIES[i][1]) >= 0)
      return ar ? CITIES[i][1] : CITIES[i][0].charAt(0).toUpperCase() + CITIES[i][0].slice(1);
  }
  return null;
}
/* A request posted with no project, at a place the renter already has a project for, must
   not be offered a second project for the same site — that is how two "Qiddiya Zone 4"s get
   created. Offer to file it there instead. Matching is on the place, and it always ASKS:
   filing is never automatic, because a same-city match is not the same site. */
function matchingProjects(){
  var place = detectedPlace();
  if (!place) return [];
  var key = place.toLowerCase();
  return PROJECTS.filter(function(p){
    return ((p.locEn || "") + " " + (p.nEn || "")).toLowerCase().indexOf(key) >= 0;
  });
}

  openModal(mshell("location_city",

      : L("You already have a project here","لديك مشروع في هذا الموقع"),
    L("Your request is posted — this changes nothing about it.","تم إرسال طلبك — وهذا لا يغيّر فيه شيئاً."),
      '<div class="infoline"><span class="icon">info</span><span>'
    +   L("You wrote ","كتبت ") + '<b>' + esc(place || "") + '</b>'
    +   L(", and that is where this project already is. Filing it there keeps one picture of the site instead of two.",
        "، وهناك يقع هذا المشروع بالفعل. إدراجه هناك يبقي صورة واحدة للموقع بدل صورتين.")
    + '</span></div>'
    + '<div class="optrow">' + cards + '</div>'
    + '<div class="hint">'
    +   L("Filing it changes nothing on the request — it keeps every term it was posted with. Where those differ from the project’s, both stay and the difference is shown on the row.",
        "الإدراج لا يغيّر شيئاً في الطلب — يحتفظ بكل شروطه كما أُرسل. وحيث تختلف عن شروط المشروع، تبقى الاثنتان ويظهر الفرق على الصف.") + '</div>',
    '<span class="spacer"></span>'
    + '<button class="btn btn-secondary" onclick="closeModal()">' + L("Not now","ليس الآن") + '</button>', true));
}
function attachToProject(pid){ closeModal(); projSel = pid; pickTab('projects'); }
/* The escape hatch: a same-city match is not the same site. */
function dlgSaveAsNewAnyway(){ dlgSaveAsProject(true); }

function dlgMoreDefaults(){
  var p = proj(iProject);
  var rows = [
    [L("Extendable","قابلة للتمديد"), p.when.extendable ? L("Yes","نعم") : L("No","لا")],
    [L("Payment terms","شروط الدفع"), L(PAY[p.prefs.pay][0], PAY[p.prefs.pay][1])]
  ].map(function(r){
    return '<div class="applyrow"><span class="nm">' + r[0] + '</span>'
      + '<span class="why" style="color:var(--navy)">' + r[1] + '</span></div>'; }).join("");
  openModal(mshell("tune", L("Project defaults","افتراضيات المشروع"),
    L("Changing any of these changes this request only","تغيير أيٍّ منها يغيّر هذا الطلب فقط"),
    '<div class="applylist">' + rows + '</div>'
    + '<div class="hint">' + L("The project holds seven fields and no more. Budget, payment method, maintenance, breakdown response, supplier filters and the bid window all belong to the request — they are decisions about one machine, not about the site.",
        "يحمل المشروع سبعة حقول فقط. الميزانية وطريقة الدفع والصيانة وزمن الاستجابة ومرشّحات المورّدين ونافذة العروض كلّها تخصّ الطلب.") + '</div>',
    '<span class="spacer"></span><button class="btn btn-primary" onclick="closeModal()">' + L("Done","تم") + '</button>'));
}

render();
</script>
