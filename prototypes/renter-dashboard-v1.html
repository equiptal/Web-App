<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<title>Renter Dashboard — Moedatech</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap"
  rel="stylesheet"
/>

<!--
  Moedatech — RENTER DASHBOARD · v1

  One page, three tabs, one evergreen strip:
    My Requests   — procurement. What went out, what came back, what needs deciding.
    My Projects   — operations. Site rail + Gantt of the machines those requests won.
    My Suppliers  — the private record. Only what the backend will show BECAUSE you
                    have a relationship: what they quoted you, how fast they answer,
                    the terms you agreed, and their papers (bid-scoped read).
    Stores        — the public market, under every tab. Facts, identical for everyone.

  The rule that keeps Stores and My Suppliers apart:
    if two renters would see the same pixel it belongs in Stores; if it differs per
    renter it belongs in My Suppliers. Company papers are the proof — the only read
    is GET /marketplace/bids/{bidId}/company-documents, derived from a bid on YOUR
    request, so Stores cannot show them even in principle.

  Requests : Projects is MANY : ONE. A project is the site and the period; requests
  are the events inside it. The first request at a new site offers to create the
  project, pre-filled from its own projectAddressLabel / startDate / endDate.

  On the system (DESIGN.md): navy ramp, six type steps, radii 8/10/14, control
  heights 30/34/44, the 4px grid, colour-only hover, and no shadows anywhere.
-->

<style>
  :root{
    --navy-deep:#16263f; --navy:#1c3550; --navy-mid:#2a4f72;
    --muted-dark:#5a6b82; --muted:#6b8fa8; --muted-light:#9aa7b8;
    --border-strong:#c3d2e0; --border:#d4e0ec;
    --surface3:#e4edf5; --surface2:#eff4f9; --background:#f5f8fc; --surface:#ffffff;

    --brand:#f79009; --brand-hover:#e58108; --brand-press:#cc7207;
    --brand-deep:#b45309; --brand-pale:#fde8cc; --brand-soft:#fff4e5;

    --ok:#1daf58; --ok-soft:#e7f7ee; --ok-deep:#15803d;
    --warn:#d4780a; --warn-soft:#fff3e0; --warn-deep:#8a4f08;
    --danger:#d9362a; --danger-soft:#fcebea; --danger-deep:#b03636;
    --info:#1a7ec8; --info-soft:#e6f2fb; --info-deep:#0e4f7e;

    --t-label:11px; --t-meta:12.5px; --t-body:13px; --t-subhead:15px;
    --t-title:17px; --t-display:22px;

    --r-sm:8px; --r-md:10px; --r-lg:14px; --r-full:999px;
    --c-sm:30px; --c-md:34px; --c-lg:44px;
    --t:150ms cubic-bezier(.32,.72,.24,1);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--background);color:var(--navy);
    font-family:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:var(--t-body);line-height:1.5;-webkit-font-smoothing:antialiased}
  [dir="rtl"] body{font-family:"IBM Plex Sans Arabic","Nunito",sans-serif}
  body.locked{overflow:hidden}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  a{color:inherit;text-decoration:none}
  h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:800;letter-spacing:-.02em}
  p{margin:0}
  table{border-collapse:collapse;width:100%}
  ::selection{background:var(--brand-pale);color:var(--navy)}
  .icon{font-family:"Material Symbols Rounded";line-height:1;display:inline-block;direction:ltr;
    -webkit-font-feature-settings:"liga";user-select:none;font-variation-settings:"opsz" 24,"wght" 400,"FILL" 0}
  .mono{font-family:"IBM Plex Mono",monospace}
  .num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){ *,*::before,*::after{transition:none !important} html{scroll-behavior:auto} }

  .wrap{max-width:1560px;margin:0 auto;padding:0 16px}
  @media (min-width:640px){ .wrap{padding:0 24px} }
  @media (min-width:1280px){ .wrap{padding:0 32px} }

  /* ── app bar ────────────────────────────────────────────────────────────── */
  .appbar{position:sticky;top:0;z-index:40;height:62px;background:var(--navy);color:#fff;
    border-bottom:1px solid rgba(255,255,255,.12);display:flex;align-items:center;padding:0 24px}
  .wordmark{display:flex;align-items:center;gap:8px;font-weight:800;font-size:var(--t-title)}
  .wordmark .m{width:var(--c-sm);height:var(--c-sm);border-radius:var(--r-sm);background:#fff;color:var(--navy);
    display:grid;place-items:center;font-size:var(--t-title)}
  .navslot{position:absolute;inset-inline:0;display:none;justify-content:center;pointer-events:none}
  @media (min-width:1100px){ .navslot{display:flex} }
  .navslot ul{pointer-events:auto;display:flex;gap:4px;list-style:none;margin:0;padding:0}
  .navtab{display:inline-flex;align-items:center;height:var(--c-md);border-radius:var(--r-full);padding:0 16px;
    font-size:var(--t-body);font-weight:600;color:rgba(255,255,255,.72);transition:background var(--t),color var(--t)}
  .navtab:hover{background:rgba(255,255,255,.1);color:#fff}
  .navtab[aria-current="page"]{background:#fff;color:var(--navy);font-weight:800}
  .barright{margin-inline-start:auto;display:flex;align-items:center;gap:14px;z-index:1}
  .iconbtn{position:relative;width:var(--c-md);height:var(--c-md);border-radius:var(--r-full);display:grid;
    place-items:center;color:rgba(255,255,255,.8);transition:background var(--t),color var(--t)}
  .iconbtn:hover{background:rgba(255,255,255,.12);color:#fff}
  .iconbtn .icon{font-size:var(--t-display)}
  .dot{position:absolute;top:4px;inset-inline-end:4px;min-width:16px;height:16px;border-radius:var(--r-full);
    background:var(--brand);color:#fff;font-size:10px;font-weight:800;line-height:16px;text-align:center;padding:0 4px}
  .avatar{width:var(--c-md);height:var(--c-md);border-radius:var(--r-full);border:1px solid rgba(255,255,255,.4);
    display:grid;place-items:center;font-size:var(--t-meta);font-weight:800}

  /* ── tab strip ──────────────────────────────────────────────────────────── */
  .tabbar{background:var(--surface);border-bottom:1px solid var(--border)}
  .tabbar .row{max-width:1560px;margin:0 auto;padding:0 24px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
  .tabbar .row::-webkit-scrollbar{display:none}
  .tab{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 16px;flex:none;
    font-size:var(--t-body);font-weight:600;color:var(--muted);border-bottom:2px solid transparent;
    transition:color var(--t),border-color var(--t),background var(--t)}
  .tab:hover{color:var(--navy);background:var(--surface2)}
  .tab .icon{font-size:var(--t-subhead)}
  .tab .c{min-width:20px;height:18px;border-radius:var(--r-full);background:var(--surface3);color:var(--navy-mid);
    font-size:var(--t-label);font-weight:800;line-height:18px;text-align:center;padding:0 6px}
  .tab[aria-selected="true"]{color:var(--navy);font-weight:800;border-bottom-color:var(--brand)}
  .tab[aria-selected="true"] .c{background:var(--brand-soft);color:var(--brand-deep)}
  .tab .c.alert{background:var(--brand);color:#fff}

  /* ── page head ──────────────────────────────────────────────────────────── */
  .phead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 0 12px}
  .phead h1{font-size:var(--t-display)}
  .phead .sum{color:var(--muted);font-size:var(--t-meta)}
  .phead .sum b{color:var(--navy);font-weight:800}
  .phead .sum .risk{color:var(--danger-deep);font-weight:800}
  .phead .spacer{flex:1}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--c-md);border-radius:var(--r-md);
    padding:0 14px;font-size:var(--t-body);font-weight:700;transition:background var(--t),border-color var(--t),color var(--t)}
  .btn .icon{font-size:var(--t-subhead)}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand-hover)}
  .btn-primary:active{background:var(--brand-press)}
  .btn-secondary{border:1px solid var(--border);background:var(--surface);color:var(--navy)}
  .btn-secondary:hover{background:var(--surface2);border-color:var(--border-strong)}
  .btn-navy{background:var(--navy);color:#fff}
  .btn-navy:hover{background:var(--navy-mid)}
  .btn-sm{height:var(--c-sm);font-size:var(--t-meta);padding:0 10px}
  .btn-icon{width:var(--c-sm);padding:0}

  /* ── filter row ─────────────────────────────────────────────────────────── */
  .filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:12px}
  .search{flex:1 1 280px;min-width:200px;display:flex;align-items:center;gap:8px;height:var(--c-md);
    border:1px solid var(--border);background:var(--surface);border-radius:var(--r-md);padding:0 12px}
  .search .icon{font-size:var(--t-subhead);color:var(--muted)}
  .search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:var(--t-body)}
  .search input::placeholder{color:var(--muted-light)}
  .pill{display:inline-flex;align-items:center;gap:7px;height:var(--c-md);border-radius:var(--r-md);padding:0 12px;
    border:1px solid var(--border);background:var(--surface);font-size:var(--t-meta);font-weight:700;color:var(--navy-mid);
    transition:background var(--t),border-color var(--t),color var(--t)}
  .pill:hover{background:var(--surface2);border-color:var(--border-strong)}
  .pill .c{font-family:"IBM Plex Mono",monospace;font-size:var(--t-label);color:var(--muted)}
  .pill .led{width:7px;height:7px;border-radius:var(--r-full)}
  .pill[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
  .pill[aria-pressed="true"] .c{color:rgba(255,255,255,.7)}

  /* ── table ──────────────────────────────────────────────────────────────── */
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
  .tscroll{overflow-x:auto}
  thead th{background:var(--surface2);border-bottom:1px solid var(--border);text-align:start;
    padding:9px 14px;font-size:var(--t-label);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-dark);
    white-space:nowrap}
  tbody td{border-bottom:1px solid var(--border);padding:12px 14px;vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr{transition:background var(--t)}
  tbody tr:hover{background:var(--surface2)}
  .rid{font-family:"IBM Plex Mono",monospace;font-size:var(--t-meta);color:var(--navy-mid);font-weight:500;white-space:nowrap}
  .rid .proj{display:block;font-family:"Nunito",sans-serif;font-size:var(--t-label);color:var(--muted);
    font-weight:700;margin-top:3px}
  .what{display:flex;align-items:center;gap:10px;min-width:260px}
  .thumb{width:38px;height:38px;border-radius:var(--r-sm);background:var(--surface3);display:grid;place-items:center;
    color:var(--navy-mid);flex:none;position:relative}
  .thumb .icon{font-size:var(--t-display)}
  .thumb .q{position:absolute;bottom:-4px;inset-inline-end:-4px;background:var(--navy);color:#fff;
    font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;border-radius:var(--r-full);padding:0 4px;
    border:2px solid var(--surface)}
  .what .n{font-size:var(--t-body);font-weight:800}
  .what .n .more{color:var(--muted);font-weight:600}
  .what .where{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:var(--t-meta);margin-top:2px}
  .what .where .icon{font-size:var(--t-body)}
  .when{white-space:nowrap;font-size:var(--t-meta)}
  .when b{display:block;font-size:var(--t-body);font-weight:800}
  .when span{color:var(--muted)}
  .bids{white-space:nowrap}
  .bids .v{font-family:"IBM Plex Mono",monospace;font-size:var(--t-subhead);font-weight:600}
  .bids .v.zero{color:var(--danger-deep)}
  .bids .best{display:block;color:var(--muted);font-size:var(--t-meta);margin-top:2px}
  .bids .best b{color:var(--navy);font-weight:800}
  .new{display:inline-flex;align-items:center;gap:4px;background:var(--brand);color:#fff;border-radius:var(--r-full);
    padding:1px 7px;font-size:var(--t-label);font-weight:800;margin-inline-start:6px}
  .badge{display:inline-flex;align-items:center;gap:5px;border-radius:var(--r-full);padding:3px 9px;
    font-size:var(--t-label);font-weight:800;white-space:nowrap}
  .badge .led{width:6px;height:6px;border-radius:var(--r-full)}
  .b-ok{background:var(--ok-soft);color:var(--ok-deep)} .b-ok .led{background:var(--ok)}
  .b-warn{background:var(--warn-soft);color:var(--warn-deep)} .b-warn .led{background:var(--warn)}
  .b-danger{background:var(--danger-soft);color:var(--danger-deep)} .b-danger .led{background:var(--danger)}
  .b-info{background:var(--info-soft);color:var(--info-deep)} .b-info .led{background:var(--info)}
  .b-mute{background:var(--surface3);color:var(--muted-dark)} .b-mute .led{background:var(--muted)}
  .sub{display:block;color:var(--muted);font-size:var(--t-meta);margin-top:4px}
  .acts{display:flex;align-items:center;gap:6px;justify-content:flex-end}
  .acts .btn{white-space:nowrap}
  .menu{position:relative}
  .menu .sheet{position:absolute;inset-inline-end:0;top:calc(100% + 4px);z-index:20;min-width:180px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:4px;display:none}
  .menu.open .sheet{display:block}
  .menu .sheet button{display:flex;align-items:center;gap:8px;width:100%;height:var(--c-md);border-radius:var(--r-sm);
    padding:0 10px;font-size:var(--t-body);font-weight:600;color:var(--navy);text-align:start;transition:background var(--t)}
  .menu .sheet button:hover{background:var(--surface2)}
  .menu .sheet button.danger{color:var(--danger-deep)}
  .menu .sheet button.danger:hover{background:var(--danger-soft)}
  .menu .sheet .rule{height:1px;background:var(--border);margin:4px 0}
  .menu .sheet .icon{font-size:var(--t-subhead);color:var(--muted)}


  /* ── new-bid panel — beside the table, not above it ──────────────────────
     Placed with logical properties, so English puts it on the trailing edge and
     Arabic mirrors it without a second rule. */
  .reqlayout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;align-items:start}
  .reqlayout.tight{grid-template-columns:minmax(0,1fr) 44px}
  .reqmain{min-width:0}

  .side{position:sticky;top:12px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r-lg);overflow:hidden}
  .sidehead{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--brand-soft);
    border-bottom:1px solid var(--brand-pale)}
  .sidehead .icon{font-size:var(--t-subhead);color:var(--brand-deep)}
  .sidehead h2{font-size:var(--t-body);color:var(--brand-deep)}
  .sidehead .spacer{flex:1}
  .sidehead .fold{width:26px;height:26px;border-radius:var(--r-sm);display:grid;place-items:center;
    color:var(--brand-deep);transition:background var(--t)}
  .sidehead .fold:hover{background:var(--brand-pale)}
  .sidehead .fold .icon{font-size:var(--t-subhead)}
  [dir="rtl"] .sidehead .fold .icon{transform:scaleX(-1)}
  .sidebody{max-height:520px;overflow:auto;padding:10px}
  .sidefoot{border-top:1px solid var(--border);padding:8px 12px;display:flex;align-items:center;gap:8px}
  .sidefoot .spacer{flex:1}
  .sidefoot button{font-size:var(--t-meta);font-weight:700;color:var(--brand-deep)}
  .sidefoot button:hover{text-decoration:underline;text-underline-offset:3px}

  .bub{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-md);
    padding:10px 12px;margin-bottom:8px;transition:background var(--t),border-color var(--t)}
  .bub:last-child{margin-bottom:0}
  .bub:hover{background:var(--surface3);border-color:var(--border-strong)}
  .bub.fresh{background:var(--brand-soft);border-color:var(--brand-pale);animation:pop 320ms cubic-bezier(.32,.72,.24,1)}
  @keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .bub .top{display:flex;align-items:center;gap:8px}
  .bub .who{width:26px;height:26px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--border);
    display:grid;place-items:center;font-size:var(--t-meta);font-weight:800;color:var(--navy);flex:none}
  .bub .n{font-size:var(--t-body);font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bub .ago{margin-inline-start:auto;color:var(--muted);font-size:var(--t-label);white-space:nowrap;flex:none}
  .bub .price{margin-top:6px;display:flex;align-items:baseline;gap:5px}
  .bub .price .v{font-family:"IBM Plex Mono",monospace;font-size:var(--t-subhead);font-weight:600}
  .bub .price .u{font-size:var(--t-label);color:var(--muted)}
  .bub .lead{display:inline-flex;align-items:center;gap:3px;background:var(--ok-soft);color:var(--ok-deep);
    border-radius:var(--r-full);padding:1px 6px;font-size:var(--t-label);font-weight:800;margin-inline-start:auto}
  .bub .lead .icon{font-size:12px}
  .bub .m{color:var(--muted);font-size:var(--t-meta);margin-top:4px}
  .bub .m b{color:var(--navy-mid);font-weight:700}
  .bub .go{margin-top:8px;width:100%;height:var(--c-sm);border-radius:var(--r-sm);background:var(--surface);
    border:1px solid var(--border);font-size:var(--t-meta);font-weight:700;color:var(--navy);transition:background var(--t)}
  .bub .go:hover{background:var(--surface3);border-color:var(--border-strong)}

  .rail-fold{position:sticky;top:12px;height:190px;width:44px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r-lg);display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0;
    transition:background var(--t),border-color var(--t)}
  .rail-fold:hover{background:var(--surface2);border-color:var(--border-strong)}
  .rail-fold .c{min-width:22px;height:22px;border-radius:var(--r-full);background:var(--brand);color:#fff;
    font-size:var(--t-label);font-weight:800;line-height:22px;text-align:center;padding:0 6px}
  .rail-fold .lbl{writing-mode:vertical-rl;font-size:var(--t-meta);font-weight:700;color:var(--muted-dark);letter-spacing:.04em}
  .rail-fold .icon{font-size:var(--t-subhead);color:var(--muted)}

  @media (max-width:1180px){
    .reqlayout,.reqlayout.tight{grid-template-columns:minmax(0,1fr)}
    .side,.rail-fold{position:static;width:auto;height:auto}
    .rail-fold{flex-direction:row;justify-content:center}
    .rail-fold .lbl{writing-mode:horizontal-tb}
  }

  /* ── projects ───────────────────────────────────────────────────────────── */
  .plane{display:grid;grid-template-columns:288px minmax(0,1fr);gap:16px;align-items:start}
  .rail{display:grid;gap:8px;max-height:640px;overflow:auto}
  .pcard{text-align:start;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
    padding:12px;border-inline-start:3px solid transparent;transition:background var(--t),border-color var(--t)}
  .pcard:hover{background:var(--surface2);border-color:var(--border-strong)}
  .pcard[aria-current="true"]{border-color:var(--navy);background:var(--surface2)}
  .pcard.alert{border-inline-start-color:var(--danger)}
  .pcard .n{font-size:var(--t-body);font-weight:800}
  .pcard .m{color:var(--muted);font-size:var(--t-meta);margin-top:3px;display:flex;align-items:center;gap:6px}
  .pcard .m .risk{color:var(--danger-deep);font-weight:700}

  .pmeta{display:flex;flex-wrap:wrap;align-items:center;gap:0;border-bottom:1px solid var(--border)}
  .pmeta .cell{padding:12px 16px;border-inline-end:1px solid var(--border);min-width:132px}
  .pmeta .k{font-size:var(--t-label);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .pmeta .v{font-size:var(--t-body);font-weight:800;margin-top:3px}
  .pmeta .spacer{flex:1;border:0}
  .pmeta .go{padding:10px 16px;display:flex;gap:8px}

  .notice{display:flex;align-items:center;gap:10px;margin:16px;padding:10px 12px;border-radius:var(--r-md);
    font-size:var(--t-body);font-weight:600}
  .notice.warn{background:var(--warn-soft);color:var(--warn-deep)}
  .notice.danger{background:var(--danger-soft);color:var(--danger-deep)}
  .notice .icon{font-size:var(--t-subhead)}

  .phases{display:flex;align-items:center;gap:8px;padding:0 16px 14px;flex-wrap:wrap}
  .phase{display:inline-flex;align-items:center;gap:6px;height:26px;border-radius:var(--r-full);padding:0 10px;
    font-size:var(--t-label);font-weight:800;background:var(--surface2);color:var(--muted-dark)}
  .phase.done{background:var(--ok-soft);color:var(--ok-deep)}
  .phase.now{background:var(--navy);color:#fff}

function days(a, b){ return Math.round((b - a) / 86400000); }

/* ══ tabs ═══════════════════════════════════════════════════════════════════ */
function pickTab(k){
  tab = k;
  ["requests","projects","suppliers"].forEach(function(x){
    document.getElementById("tab-" + x).setAttribute("aria-selected", String(x === k));
    document.getElementById("panel-" + x).hidden = x !== k;
  });
  render();
}

/* ══ 1 · requests ═══════════════════════════════════════════════════════════ */
var REQ_FILTERS = [
  {k:"all",     enEn:"All",          enAr:"الكل",           tone:""},
  {k:"new",     enEn:"Has new bids", enAr:"بها عروض جديدة", tone:"var(--brand)"},
  {k:"nobids",  enEn:"No bids",      enAr:"بلا عروض",       tone:"var(--danger)"},
  {k:"closing", enEn:"Closing soon", enAr:"يغلق قريباً",    tone:"var(--warn)"}
];
function reqMatch(r, f){
  if (f === "new") return r.fresh > 0;
  if (f === "nobids") return r.bids === 0;
  if (f === "closing") return /closes/.test(r.subEn);
  return true;
}


function renderFeed(){
  if (!BID_EVENTS.length) return "";
  if (!sideOpen){
    return '<button class="rail-fold" type="button" onclick="toggleSide()" aria-label="'
      + L("Show new bids", "اعرض العروض الجديدة") + '">'
      + '<span class="c">' + BID_EVENTS.length + '</span>'
      + '<span class="lbl">' + L("New bids", "عروض جديدة") + '</span>'
      + '<span class="icon" aria-hidden="true">gavel</span></button>';
  }
  var rows = BID_EVENTS.map(function(e, i){
    return '<article class="bub' + (i === 0 ? " fresh" : "") + '">'
      + '<div class="top"><span class="who">' + L(e.supEn, e.supAr).charAt(0) + '</span>'
      +   '<span class="n">' + L(e.supEn, e.supAr) + '</span>'
      +   '<span class="ago">' + L(e.agoEn, e.agoAr) + '</span></div>'
      + '<div class="price"><span class="v">' + money(e.price) + '</span>'

      +   (e.cheapest ? '<span class="lead"><span class="icon" aria-hidden="true">trending_down</span>'
            + L("lowest", "الأدنى") + '</span>' : '') + '</div>'
      + '<div class="m">' + L(e.eqEn, e.eqAr) + ' · <b>' + e.req + '</b></div>'
      + '<button class="go">' + L("View bid", "اعرض العرض") + '</button>'

    + '<div class="sidehead"><span class="icon" aria-hidden="true">gavel</span>'
    +   '<h2>' + BID_EVENTS.length + ' ' + L("new bids", "عروض جديدة") + '</h2>'
    +   '<span class="spacer"></span>'

/* ══ 2 · projects ═══════════════════════════════════════════════════════════ */
function ganttSpan(p){
  var from = d(p.start), to = d(p.end);
  p.machines.forEach(function(m){
    [m.mob, m.rent, m.over].forEach(function(seg){
      if (!seg) return;
      if (d(seg[0]) < from) from = d(seg[0]);
      if (d(seg[1]) > to) to = d(seg[1]);
    });
  });
  from = new Date(from.getFullYear(), from.getMonth(), 1);
  to = new Date(to.getFullYear(), to.getMonth() + 1, 1);
  return { from:from, to:to, total:days(from, to) };
}
function pct(x, s){ return (days(s.from, x) / s.total) * 100; }
function seg(cls, range, label, s, tail){
  if (!range) return "";
  var a = Math.max(0, pct(d(range[0]), s)), b = Math.min(100, pct(d(range[1]), s));
  if (b <= a) return "";
  return '<span class="bar ' + cls + '" title="' + label + ' · ' + range[0] + ' → ' + range[1] + '" '
    + 'style="inset-inline-start:' + a + '%;width:' + (b - a) + '%">'
    + ((b - a) > 12 ? label : "") + (tail ? '<span class="tail">' + tail + '</span>' : '') + '</span>';
}

function renderProjects(){
  var p = PROJECTS.filter(function(x){ return x.id === proj; })[0] || PROJECTS[0];
  var s = ganttSpan(p);

  var rail = PROJECTS.map(function(x){
    return '<button class="pcard' + (x.alert ? " alert" : "") + '" type="button" aria-current="' + (x.id === proj)
      + '" onclick="pickProject(\'' + x.id + '\')">'
      + '<span class="n">' + L(x.nEn, x.nAr) + '</span>'
      + '<span class="m">' + (x.onSite
          ? '<span>' + x.onSite + ' ' + L("on site", "في الموقع") + '</span>'
          : '<span>' + L("nothing on site yet", "لا شيء في الموقع بعد") + '</span>')
      + (x.alert ? '<span class="risk">· ' + L("overdue", "متأخّر") + '</span>' : '') + '</span></button>';
  }).join("");

  var months = "", cur = new Date(s.from.getFullYear(), s.from.getMonth(), 1);
  var moEn = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var moAr = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  while (cur < s.to){
    var next = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
    months += '<span class="gmonth" style="inset-inline-start:' + pct(cur, s) + '%;width:'
      + (pct(next, s) - pct(cur, s)) + '%">' + L(moEn[cur.getMonth()], moAr[cur.getMonth()])
      + " " + String(cur.getFullYear()).slice(2) + '</span>';
    cur = next;
  }
  var todayP = pct(d(TODAY), s);

  var rows = p.machines.map(function(m){
    return '<div class="grow">'
      + '<div class="gcol"><div class="n">' + L(m.nEn, m.nAr) + '</div><div class="m">' + L(m.mEn, m.mAr) + '</div></div>'
      + '<div class="gtrack">'
      +   (todayIn ? '<span class="gtoday" style="inset-inline-start:' + todayP + '%"></span>' : '')
      +   seg("mob", m.mob, L("Mobilising", "نقل"), s)
      +   seg(m.state === "plan" ? "plan" : "rent", m.rent,
             m.state === "plan" ? L("Planned", "مخطّط") : L("On rent", "قيد الإيجار"), s)
      +   seg("over", m.over, L("Still billing", "ما زالت تُحتسب"), s)
      + '</div></div>';
  }).join("");

  var phases = PHASES.map(function(ph, i){
    var cls = i < p.phase ? "done" : i === p.phase ? "now" : (ph.real ? "" : "soon");
    return '<span class="phase ' + cls + '"><span class="icon" aria-hidden="true">' + ph.ic + '</span>'
      + L(ph.enEn, ph.enAr) + '</span>';
  }).join("");

  document.getElementById("panel-projects").innerHTML =
      '<div class="phead"><h1>' + L("My Projects", "مشاريعي") + '</h1>'
    +   '<span class="sum"><b>' + PROJECTS.length + '</b> ' + L("projects", "مشاريع") + ' · <b>'
    +     PROJECTS.reduce(function(n, x){ return n + x.onSite; }, 0) + '</b> ' + L("machines on site", "معدّة في الموقع")
    +     ' · <span class="risk">1 ' + L("overdue", "متأخّر") + '</span></span>'
    +   '<span class="spacer"></span>'
    +   '<button class="btn btn-secondary"><span class="icon" aria-hidden="true">add</span>' + L("New project", "مشروع جديد") + '</button>'
    + '</div>'
    + '<div class="plane"><div class="rail">' + rail + '</div>'
    + '<div class="panel">'
    +   '<div class="pmeta">'
    +     '<div class="cell"><div class="k">' + L("Project", "المشروع") + '</div><div class="v">' + L(p.nEn, p.nAr) + '</div></div>'
    +     '<div class="cell"><div class="k">' + L("Client", "العميل") + '</div><div class="v">' + L(p.clientEn, p.clientAr) + '</div></div>'
    +     '<div class="cell"><div class="k">' + L("Starts", "يبدأ") + '</div><div class="v num">' + p.start + '</div></div>'
    +     '<div class="cell"><div class="k">' + L("Ends", "ينتهي") + '</div><div class="v num">' + p.end + '</div></div>'
    +     '<div class="cell"><div class="k">' + L("Location", "الموقع") + '</div><div class="v">' + L(p.locEn, p.locAr) + '</div></div>'
    +     '<div class="cell spacer"></div>'
    +     '<div class="go"><button class="btn btn-secondary btn-sm">' + L("New request here", "طلب جديد هنا") + '</button>'
    +       '<button class="btn btn-navy btn-sm">' + L("Open project", "افتح المشروع") + '</button></div>'
    +   '</div>'
    +   (p.noticeEn ? '<div class="notice ' + (p.alert ? "danger" : "warn") + '">'
    +     '<span class="icon" aria-hidden="true">' + (p.alert ? "error" : "info") + '</span>' + L(p.noticeEn, p.noticeAr) + '</div>' : '')
    +   '<div class="phases">' + phases + '<span class="phasenote">'
    + L("PO, on-hire and invoice are not tracked yet — shown for shape",
        "أمر الشراء وبدء الإيجار والفاتورة غير متتبَّعة بعد — تظهر للشكل") + '</span></div>'
    +   '<div class="gantt"><div class="gmin">'
    +     '<div class="grow ghead"><div class="gcol">' + L("Machine", "المعدّة") + '</div>'
    +       '<div class="gtrack">' + months
             + (todayIn ? '<span class="gtoday" style="inset-inline-start:' + todayP + '%"><span>'
    +           + L("today", "اليوم") + '</span></span>' : '') + '</div></div>'
    +     (rows || '<div class="empty"><b>' + L("No machines on this project yet", "لا معدّات في هذا المشروع بعد") + '</b>'
             + L("Award a bid and it appears here as a bar.", "أرسِ عرضاً وسيظهر هنا كشريط.") + '</div>')
    +   '</div></div>'
    + '</div></div>';
}

  {k:"worked",    enEn:"Worked with",     enAr:"تعاملت معهم"},
  {k:"papers",    enEn:"Papers expiring",  enAr:"أوراق تنتهي"},
  {k:"blocked",   enEn:"Avoid",           enAr:"تجنّب"}
];
function supMatch(s, f){
  if (f === "preferred") return s.label === "preferred";
  if (f === "blocked") return s.label === "blocked";
  if (f === "worked") return s.bids > 0;
  if (f === "papers") return s.papers.some(function(p){ return p[1] === "soon" || p[1] === "miss"; });
  return true;
}

    +     '<th>' + L("Quoted you", "سعّروا لك") + '</th>'
    +     '<th>' + L("Terms you agreed", "الشروط المتّفقة") + '</th>'
    +     '<th>' + L("Papers", "الأوراق") + '</th>'
    +     '<th style="text-align:end">' + L("Actions", "إجراءات") + '</th>'
    +   '</tr></thead><tbody>' + body + '</tbody></table></div></div>';
}
function setSupFilter(k){ supFilter = k; openMenu = null; renderSuppliers(); }

/* ══ stores strip ═══════════════════════════════════════════════════════════ */
function renderStores(){
  document.getElementById("stores").innerHTML = STORES.map(function(s){
    return '<button class="scard" type="button">'
      + '<span class="sshot"><span class="icon" aria-hidden="true">' + s.ic + '</span>'
      +   (s.ver ? '<span class="v"><span class="icon" aria-hidden="true">check</span></span>' : '') + '</span>'
      + '<span class="sbody"><span class="n">' + L(s.n, s.nAr) + '</span>'
      +   '<span class="m">' + s.eq + ' ' + L("machines", "معدّة") + ' · ' + L(s.city, s.cityAr) + '</span></span></button>';
  }).join("");
}

/* ══ render ═════════════════════════════════════════════════════════════════ */
function render(){
  if (tab === "requests") renderRequests();
  if (tab === "projects") renderProjects();
  if (tab === "suppliers") renderSuppliers();
  renderStores();
}
document.addEventListener("click", function(){ if (openMenu){ openMenu = null; render(); } });
render();
</script>
</body>
</html>
