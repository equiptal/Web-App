<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    The browser tab's icon: the Moedatech wordmark in white on a navy ground (owner, 2026-09-03,
    asking for "the logo with the navy background, same as one on prod but navy background and white
    font").

    THE MARK IS PROD'S. It is `public/moedatech-logo.svg` inlined, which is the same artwork
    `web.moedatech.net` serves as its icon: the wordmark with the excavator arm as its roofline.
    ~~The abstract four path logomark that was here.~~ That is a different piece of artwork
    altogether, and nobody outside this repo would read it as this company.

    INLINED, not referenced. A favicon is fetched as a standalone document, so an external `href`,
    a `use` into another file, or a CSS variable all resolve to nothing. The colours are literals for
    the same reason: the navy-deep token's value and white, written out.

    THE GROUND. The wordmark ships navy on transparent, which is what prod uses. A transparent icon
    borrows whatever the browser paints behind it, so it read as a grey smudge on a light tab strip
    and vanished on a dark one. Inverting it onto a navy tile fixes both: one appearance in every
    window, and the roundel is the app's own navy.

    THE GEOMETRY. The mark is 567 x 213, about 2.7 to 1, so a square canvas is filled by its
    WIDTH and the height falls where it falls. 58 of side padding keeps it off the rounded
    corners; the rest is centred vertically. `rx` is a fifth of the canvas, which is the roundel the
    app icon already uses.

    NOTE FOR THE NEXT EDITOR: this is XML, so a comment may not contain two hyphens in a row.

    THE ROOT ELEMENT COMES FIRST, and the prose lives INSIDE it. This documentation used to sit above
    `<svg>` and it broke twelve staging deploys: Next's metadata image loader sniffs the first bytes
    for a root element, found 1.5 KB of comment, and reported a valid SVG as a corrupt image. Only
    `npm run build` catches that; typecheck, lint and test do not compile the app.

    `width` and `height` are stated as well as `viewBox`, so the measurement never has to parse the
    box at all.
  -->
  <rect width="512" height="512" rx="102" fill="#161c2c" />
  <g transform="translate(58.00 181.44) scale(0.698500)" fill="#ffffff">
    <path d="M544.48235,139.19264c-10.66597-3.54671-38.23046-3.16793-48.69839,1.16213-14.97023,6.18953-20.14395,21.61598-18.89571,36.95636h-64.64133v-3.90825h49.37845v-34.5546l-1.35154-1.35154h-54.75877c-.72314,0-7.26559,1.83362-8.50522,2.26404-16.14097,5.71607-22.13252,21.96034-20.66906,38.12716h-29.06236v-10.8898c0-13.17964-15.69331-30.06955-29.17428-30.06955h-60.59532v35.89753h53.86345v4.49362h-53.86345v35.89753l279.99205.26686c33.65928,0,41.67381-62.7733,6.9815-74.2915ZM530.76898,177.5866h-17.94879v-4.49362h17.94879v4.49362Z"/>
    <path d="M541.03685,99.23785h-13.35182v15.56422l-.75755-.18941h-14.31597c-3.69304,0-8.45352,5.1307-9.11639,10.53682h23.05358v.02585h23.17417v-17.25145c0-3.98575-4.70889-8.68602-8.68602-8.68602ZM539.35817,114.80207h-1.29989v-5.19096h1.29989v5.19096Z"/>
