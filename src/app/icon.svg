    <path d="M228.94132,43.70562l-161.61386,95.10645h47.12141c12.90599,0,29.17224,16.14364,29.17224,29.16673l.02231,9.75195,19.09153-.14503v-40.38977h34.5553l1.34858,1.34865v74.93953L.0005,213.48213l.02434-35.18297h107.69797v-3.58882H0v-35.447C31.73005,123.48758,238.8893,0,238.8893,0l51.3064,19.55968c-.03901,0-5.65057,9.82433-6.16323,10.75503l-49.86867-15.0626-.06129-.01673.05571.02789,92.47076,40.0721c.64082,2.85865,4.37443,17.88791,4.37443,17.88791l-102.06209-29.51766Z"/>
