<?xml version="1.0" encoding="UTF-8"?>
<!--
  The palm grove that sits behind the National Day header.

  Generated from the Flutter kit's own _HeaderDecorPainter maths (the ANGLES table, frond() and
  palm()), so the web bar draws the SAME tree the app draws rather than a second artist's palm.
  Eight trunks at unequal scale and lean across a 1440x52 bar, anchored to the bottom edge and cut
  off by it; white at 16%, which is the alpha the app renders.

  A FILE, not a data URI and not a CustomPainter: the web has neither of the constraints the kit
  was written against (Shorebird patches carry no assets, and a new Icons.* glyph is tree-shaken
  out of the release font), and 6.3 kB of path data inlined into globals.css would be paid for by
  every reader all year. Off-season the seasonal selector never matches, so it is never fetched.

  preserveAspectRatio is set by the CSS that uses it (background-size: cover), not here.
-->
